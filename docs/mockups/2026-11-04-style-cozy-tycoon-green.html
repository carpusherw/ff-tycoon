<!DOCTYPE html>
<html lang="en" data-theme="light" data-device="laptop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FF Tycoon · Cozy Green</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* GoFreight brand greens (gofreight.com theme-overrides CSS): 500 #34aa97, 400 #4ec1ac, 700 #207f73, 900 #0b5e54, 100 #d7f1ec, deep surface #072929.
   --brand = decorative green (borders, pins, routes); --accent/--btn = the text-bearing green (white text passes AA on 700, dark ink on 400). */
:root{
  --bg:#eef6ec; --bg-dot:#d9ecd9; --card:#fffef9; --card-2:#f5faf1; --ink:#1f3a33; --muted:#557064; --line:#d3e7d7; --shadow:#b9d9c5;
  --sea:#a8dfe3; --wave:#e9fbfb; --land:#d6eba2; --land-2:#a9cd7e; --land-edge:#7fae5c; --sand:#f6e7b4; --tree:#5f9e4d; --tree-2:#4a8a3c; --cloud:#ffffff;
  --route:#ffffff; --route-halo:#34aa97; --hull:#ff6f5e; --cabin:#ffffff;
  --sales:#ff7d66; --sales-soft:#ffe1da; --ops:#f5a524; --ops-soft:#ffefcc; --acct:#7d6be0; --acct-soft:#e8e4fb;
  --bad:#d63a4f; --bad-soft:#ffdde1; --due-ink:#ffffff; --good:#2d7414; --good-soft:#eaf5dd;
  --brand:#34aa97; --brand-soft:#d7f1ec; --accent:#207f73; --office:#34aa97; --agent:#3b82d6;
  --btn:#207f73; --btn-ink:#ffffff; --btn-shadow:#0b5e54; --bar:#e0eee2;
  --frame:#d3e9de;
  --round:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif; --body:"Nunito",ui-rounded,system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0a2422; --bg-dot:#0f2f2c; --card:#113430; --card-2:#163f3a; --ink:#ecf7f1; --muted:#a0c4b8; --line:#26564e; --shadow:#04120f;
  --sea:#16465e; --wave:#3f7898; --land:#5d8f4f; --land-2:#3c6a3c; --land-edge:#8fc27a; --sand:#b9a874; --tree:#3f7a45; --tree-2:#2f6236; --cloud:#b9d6ce;
  --route:#fff1b8; --route-halo:#4ec1ac; --hull:#ff8a78; --cabin:#ecf7f1;
  --sales:#ff9b87; --sales-soft:#4a2d33; --ops:#ffc35c; --ops-soft:#45381e; --acct:#b3a4ff; --acct-soft:#2f2c52;
  --bad:#ff6d84; --bad-soft:#52222f; --due-ink:#2a0910; --good:#a8d96a; --good-soft:#243d1d;
  --brand:#4ec1ac; --brand-soft:#123f3a; --accent:#4ec1ac; --office:#4ec1ac; --agent:#6aa8ff;
  --btn:#4ec1ac; --btn-ink:#05221e; --btn-shadow:#207f73; --bar:#0b2a27;
  --frame:#051513;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) radial-gradient(var(--bg-dot) 2px,transparent 2.5px) 0 0/22px 22px;color:var(--ink);font:600 13px/1.4 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:18px;height:18px;flex:none}

.toggles{position:fixed;top:14px;right:14px;z-index:50;display:flex;gap:8px}
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px;box-shadow:0 3px 0 var(--shadow)}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 9px;font:600 11.5px var(--round);color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--btn-ink)}

.app{max-width:1280px;margin:0 auto;padding:14px 18px 24px}
/* top bar */
.top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding-right:236px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font:700 20px var(--round);margin-right:2px;white-space:nowrap}
.logo{width:40px;height:40px;border-radius:14px;background:var(--accent);display:grid;place-items:center;box-shadow:0 3px 0 var(--btn-shadow)}
.pill{display:flex;align-items:center;gap:7px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:5px 10px 5px 5px;box-shadow:0 3px 0 var(--shadow);white-space:nowrap}
.pill .ic{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--card-2)}
.pill b{font:600 16px var(--round);display:block;line-height:1.1}
.pill small{display:block;font:700 10.5px var(--body);color:var(--muted);line-height:1.2}
.pill small.up{color:var(--good)}
.speed{display:flex;gap:4px;margin-left:6px}
.speed button{width:32px;height:28px;border-radius:10px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--shadow);font:700 13px var(--round)}
.speed button.on{background:var(--accent);border-color:var(--accent);color:var(--btn-ink);box-shadow:0 3px 0 var(--btn-shadow)}

/* layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"map money" "depts log" "hire hire";gap:16px;align-items:start}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--shadow)}
.card h2{margin:0;font:700 17px var(--round);display:flex;align-items:center;gap:8px}

/* map */
.mapwrap{grid-area:map;padding:8px;position:relative;overflow:hidden}
.mapwrap>svg{display:block;width:100%;height:auto;border-radius:16px;background:var(--sea)}
.speed.on-map{display:none;position:absolute;right:14px;top:12px;margin:0}
.maptag{position:absolute;left:20px;top:18px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;font:600 12.5px var(--round);display:flex;gap:6px;align-items:center;box-shadow:0 3px 0 var(--shadow)}
.legend{position:absolute;right:20px;bottom:18px;display:flex;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font:700 11px var(--body);color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}.legend i{width:10px;height:10px;border-radius:50%}
.wave{fill:none;stroke:var(--wave);stroke-width:1.2;stroke-linecap:round;opacity:.7}
.land-shadow{fill:var(--land-2);transform:translateY(3px)}
.land-sand{fill:none;stroke:var(--sand);stroke-width:5;stroke-linejoin:round}
.land-main{fill:var(--land);stroke:var(--land-edge);stroke-width:1.6;stroke-linejoin:round}
.tree-trunk{fill:#9a6a44}.tree-top{fill:var(--tree)}.tree-top2{fill:var(--tree-2)}
.mtn{fill:var(--land-2);stroke:var(--land-edge);stroke-width:1;stroke-linejoin:round}.mtn-snow{fill:#fff}
.cloud{fill:var(--cloud);opacity:.85;animation:drift 60s linear infinite alternate}
.cloud.c2{animation-duration:80s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translateX(60px)}}
.lane-halo{fill:none;stroke:var(--route-halo);stroke-width:6;stroke-linecap:round;opacity:.45}
.lane-dots{fill:none;stroke:var(--route);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:.1 6.5}
.port{fill:var(--card);stroke:var(--ink);stroke-width:1.2}
.pin-shape{stroke:var(--ink);stroke-width:1.3}
.pin-bub{fill:var(--card);stroke:var(--ink);stroke-width:1.2}
.pin-t{font:600 10px var(--round);fill:var(--ink)}
.pin-s{font:700 7.5px var(--body);fill:var(--muted)}
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 80%}
.ship:nth-child(2n) .bob{animation-delay:-1.3s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-1.4px) rotate(4deg)}}
.hull{fill:var(--hull);stroke:var(--ink);stroke-width:.9;stroke-linejoin:round}
.cabin{fill:var(--cabin);stroke:var(--ink);stroke-width:.8}
.wake{fill:none;stroke:#fff;stroke-width:1.1;stroke-linecap:round;opacity:.8}

.tabs{display:none}

/* departments */
.depts{grid-area:depts;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dept{padding:12px 12px 14px;min-width:0}
.dh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.dh .badge{width:38px;height:38px;border-radius:13px;background:var(--soft);display:grid;place-items:center;color:var(--c)}
.dh .badge svg{width:22px;height:22px}
.dh h2{display:block}
.dh h2 small{display:block;font:700 11px var(--body);color:var(--muted)}
.dh .q{margin-left:auto;text-align:right;font:700 11px var(--body);color:var(--muted);line-height:1.2}
.dh .q b{display:block;font:600 16px var(--round);color:var(--ink)}
.btn{border:0;border-radius:12px;padding:6px 12px;background:var(--btn);color:var(--btn-ink);font:600 13px var(--round);box-shadow:0 3px 0 var(--btn-shadow);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-shadow)}
.btn.soft{background:var(--card-2);color:var(--ink);box-shadow:0 3px 0 var(--shadow);border:2px solid var(--line)}
.btn.small{padding:4px 10px;font-size:12px}
.staff{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:3px 10px 3px 3px;font-weight:700;font-size:12.5px;white-space:nowrap}
.chip .av{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:600 12px var(--round);border:2px solid var(--card)}
.chip .ld{background:var(--card);border-radius:999px;padding:0 7px;font-size:11px;color:var(--muted)}
.chip.full .ld{color:var(--bad);font-weight:800}
.star{color:#f6b500;font-size:14px}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{background:var(--card-2);border:2px solid var(--line);border-radius:16px;padding:8px 10px 9px}
.task .tt{font-size:12.5px;line-height:1.35}
.task .tt b{font-weight:800}
.task .tt .lane{font:600 12px var(--round);color:var(--muted)}
.task .tm{display:flex;align-items:center;gap:8px;margin-top:7px}
.bar{flex:1;height:10px;background:var(--bar);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--c) repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px)}
.pg{font:600 12.5px var(--round);white-space:nowrap}
.due{font:700 11px var(--body);color:var(--muted);background:var(--card);border-radius:999px;padding:1px 8px;white-space:nowrap}
.task.hot{border-color:var(--bad);background:var(--bad-soft)}
.task.hot .due{background:var(--bad);color:var(--due-ink);animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}
.task.wait{opacity:.62}
.more{text-align:center;font-size:11.5px;color:var(--muted);margin-top:2px}

/* hiring dialog */
.hire{grid-area:hire;padding:0 18px 18px;position:relative;border-color:var(--brand)}
.hire.flash{animation:flash 1s}
@keyframes flash{30%{transform:scale(1.01)}}
.ribbon{display:flex;align-items:center;gap:12px;margin:0 -18px 14px;padding:12px 18px;background:var(--accent);color:var(--btn-ink);border-radius:19px 19px 0 0}
.ribbon h2{font-size:19px}
.ribbon p{margin:0;font-weight:700;opacity:.9}
.ribbon .sp{flex:1}
.ribbon .seg{box-shadow:none;border-color:transparent;background:rgba(255,255,255,.25)}
.ribbon .seg button{color:var(--btn-ink)}
.ribbon .seg button.on{background:var(--card);color:var(--ink)}
.close{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.3);font:700 15px var(--round)}
.cands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cand{background:var(--card-2);border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.face{width:64px;height:64px}
.cand h3{margin:0;font:600 16px var(--round);line-height:1.2}
.stats{width:100%;display:flex;flex-direction:column;gap:5px}
.stat{display:flex;align-items:center;gap:8px;font-size:12px;text-align:left}
.stat .l{width:62px;color:var(--muted);font-weight:700}
.pips{display:flex;gap:3px;flex:1}.pips i{width:10px;height:10px;border-radius:50%;background:var(--bar)}.pips i.f{background:var(--sales)}
.stat .v{font:600 12.5px var(--round);white-space:nowrap}
.tag{font:600 15px var(--round);background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:3px 12px}
.tag small{font:700 11px var(--body);color:var(--muted)}
.cand .btn{width:100%;font-size:15px;padding:8px}
.hf{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;color:var(--muted);font-size:12px}

/* money / log */
.money{grid-area:money;padding:14px 16px}
.rows{margin-top:8px}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:12.5px}
.row .v{font:600 13.5px var(--round);white-space:nowrap}
.row .v.pos{color:var(--good)}
.row.net{margin:6px 0;padding:8px 10px;background:var(--good-soft);border-radius:14px;font-weight:800}
.row.net .v{color:var(--good);font-size:16px}
.row.sub{color:var(--muted)}
.log{grid-area:log;padding:14px 16px}
.log .ln{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:2px dotted var(--line);font-size:12.5px}
.log .ln:last-child{border-bottom:0}
.log .d{flex:none;font:600 11px var(--round);background:var(--card-2);border:2px solid var(--line);border-radius:8px;padding:0 6px;color:var(--muted)}
.log .ln.good .m::before{content:"▲ ";color:var(--good)}.log .ln.bad .m::before{content:"▼ ";color:var(--bad)}.log .ln.info .m::before{content:"● ";color:var(--agent)}

/* ===== phone ===== */
[data-device="phone"] body{background:var(--frame)}
[data-device="phone"] .app{width:375px;max-width:100%;padding:10px 10px 20px;background:var(--bg) radial-gradient(var(--bg-dot) 2px,transparent 2.5px) 0 0/22px 22px;min-height:100vh}
[data-device="phone"] .top{padding-right:0;gap:6px;margin-bottom:10px}
[data-device="phone"] .brand{width:100%;height:40px;font-size:18px}
[data-device="phone"] .logo{width:34px;height:34px;border-radius:12px}
[data-device="phone"] .toggles{top:12px;right:10px;gap:4px}
[data-device="phone"] .toggles .seg button{padding:3px 7px;font-size:10.5px}
[data-device="phone"] .pill{padding:3px 8px 3px 4px;gap:5px;border-radius:13px}
[data-device="phone"] .pill .ic{width:24px;height:24px;border-radius:8px}
[data-device="phone"] .pill .ic svg{width:15px;height:15px}
[data-device="phone"] .pill b{font-size:13.5px}
[data-device="phone"] .pill small{font-size:9.5px}
[data-device="phone"] .pill{flex:1 1 auto}
[data-device="phone"] .p-date .speed{display:none}
[data-device="phone"] .speed.on-map{display:flex;right:12px;top:11px}
[data-device="phone"] .speed button{width:30px;height:26px;font-size:11.5px;border-radius:9px}
[data-device="phone"] .main{display:block}
[data-device="phone"] .mapwrap{padding:5px;border-radius:18px}
[data-device="phone"] .mapwrap>svg{border-radius:13px}
[data-device="phone"] .maptag{left:12px;top:11px;font-size:11px;padding:2px 9px 2px 6px}
[data-device="phone"] .legend{right:12px;bottom:11px;font-size:9.5px;padding:2px 8px;gap:7px}
[data-device="phone"] .pin-s{display:none}
[data-device="phone"] .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
[data-device="phone"] .tabs button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 0 5px;font:600 12px var(--round);box-shadow:0 3px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted)}
[data-device="phone"] .tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--btn-ink);box-shadow:0 3px 0 var(--btn-shadow)}
[data-device="phone"] [data-panel]:not(.on){display:none}
[data-device="phone"] .depts{grid-template-columns:1fr;gap:12px}
[data-device="phone"] .hire{padding:0 10px 14px}
[data-device="phone"] .ribbon{margin:0 -10px 12px;padding:10px 12px;flex-wrap:wrap;gap:4px 10px}
[data-device="phone"] .ribbon .seg{display:none}
[data-device="phone"] .ribbon h2{font-size:16px}[data-device="phone"] .ribbon p{font-size:11.5px;order:3;width:100%}
[data-device="phone"] .cands{gap:6px}
[data-device="phone"] .cand{padding:9px 6px;border-radius:16px;gap:6px}
[data-device="phone"] .face{width:44px;height:44px}
[data-device="phone"] .cand h3{font-size:12.5px}
[data-device="phone"] .stat{flex-wrap:wrap;gap:2px 4px;font-size:11px}
[data-device="phone"] .stat .l{width:auto;flex:1}
[data-device="phone"] .pips{order:3;flex:0 0 100%;gap:2px}[data-device="phone"] .pips i{width:7px;height:7px}
[data-device="phone"] .stat .v{font-size:11.5px}
[data-device="phone"] .tag{font-size:12.5px;padding:2px 6px}
[data-device="phone"] .cand .btn{font-size:13px;padding:6px}
[data-device="phone"] .hf{flex-direction:column;gap:6px;text-align:center}
</style>
</head>

function project(pts) { return pts.map(q => P(q[0], q[1])); }
function lineD(pts) { return project(pts).map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(''); }
function smoothD(pts) {
  const p = project(pts), r = v => v.toFixed(1);
  let d = `M${r(p[0][0])},${r(p[0][1])}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    d += `C${r(p1[0] + (p2[0] - p0[0]) / 6)},${r(p1[1] + (p2[1] - p0[1]) / 6)} ${r(p2[0] - (p3[0] - p1[0]) / 6)},${r(p2[1] - (p3[1] - p1[1]) / 6)} ${r(p2[0])},${r(p2[1])}`;
  }
  return d;
}
/* cfg: { smooth, viewBox:{laptop,phone}, decorate(svg,layers), land(d,layer), lane(id,d,layer), port(p,x,y,layer), pin(p,x,y,layer), ship(s,g), orient:'rotate'|'flip', rate } */
const MAP = { ships: [], speed: 1 };
function buildMap(svg, cfg) {
  MAP.svg = svg; MAP.cfg = cfg;
  const L = {};
  ['under', 'land', 'over', 'lanes', 'ports', 'pins', 'ships', 'top'].forEach(k => L[k] = svgEl('g', { class: 'ly-' + k }, svg));
  const measure = svgEl('g', { opacity: 0, fill: 'none', 'pointer-events': 'none' }, svg);
  if (cfg.decorate) cfg.decorate(svg, L);
  LAND.forEach(poly => cfg.land(lineD(poly) + 'Z', L.land));
  const paths = {};
  for (const id in LANES) {
    const d = cfg.smooth ? smoothD(LANES[id]) : lineD(LANES[id]);
    cfg.lane(id, d, L.lanes);
    const m = svgEl('path', { d }, measure); paths[id] = { el: m, len: 0 };
  }
  for (const id in paths) paths[id].len = paths[id].el.getTotalLength();
  PORTS.forEach(p => { const [x, y] = P(...p.ll); cfg.port(p, x, y, L.ports); });
  PINS.forEach(p => { const [x, y] = P(...p.ll); cfg.pin(p, x, y, L.pins); });
  MAP.ships = SHIPS.map(s => {
    const g = svgEl('g', { class: 'ship' }, L.ships);
    const t = svgEl('title', {}, g); t.textContent = `${s.id} · ${s.cust} · ${s.lane.replace('-', '→')}`;
    cfg.ship(s, g);
    return { ...s, g, rot: g.querySelector('.rot'), path: paths[s.lane] };
  });
  MAP.ships.forEach(placeShip);
  setViewBox();
  window.addEventListener('ff:device', setViewBox);
  let last = performance.now();
  const rate = cfg.rate || .011;
  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (MAP.speed) MAP.ships.forEach(s => { s.t = (s.t + dt * MAP.speed * s.v * rate) % 1; placeShip(s); });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function placeShip(s) {
  const L = s.path.len, at = s.t * L;
  const a = s.path.el.getPointAtLength(at), b = s.path.el.getPointAtLength(Math.min(L, at + 2));
  const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
  s.g.setAttribute('transform', `translate(${a.x.toFixed(2)},${a.y.toFixed(2)})`);
  const fade = Math.min(1, s.t / .03, (1 - s.t) / .03);
  s.g.setAttribute('opacity', fade.toFixed(2));
  if (!s.rot) return;
  if (MAP.cfg.orient === 'flip') {
    const left = b.x < a.x, norm = v => ((v + 540) % 360) - 180;
    const tilt = Math.max(-20, Math.min(20, norm(left ? 180 - ang : ang)));
    s.rot.setAttribute('transform', `scale(${left ? -1 : 1},1) rotate(${tilt.toFixed(1)})`);
  } else s.rot.setAttribute('transform', `rotate(${ang.toFixed(1)})`);
}
function setViewBox() {

}

/* ---- chrome: theme / device toggles, phone tabs, speed buttons ---- */
function initChrome(defaults) {

  const st = { theme: q.get('theme') || defaults.theme || 'light', device: q.get('device') || 'laptop', tab: q.get('tab') || 'depts' };
  function apply() {
    root.dataset.theme = st.theme; root.dataset.device = st.device;
    $$('[data-group] button').forEach(b => { const on = st[b.parentNode.dataset.group] === b.dataset.v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    $$('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === st.tab));
    $$('[data-panel]').forEach(p => p.classList.toggle('on', p.dataset.panel === st.tab));
    window.dispatchEvent(new Event('ff:device'));
  }
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-group] button'); if (g) { st[g.parentNode.dataset.group] = g.dataset.v; apply(); return; }
    const t = e.target.closest('[data-tab]'); if (t) { st.tab = t.dataset.tab; apply(); return; }
    const h = e.target.closest('[data-open-hiring]');
    if (h) { if (st.device === 'phone') { st.tab = 'hiring'; apply(); } else { const d = $('[data-panel=hiring]'); d.scrollIntoView({ behavior: 'smooth', block: 'center' }); d.classList.remove('flash'); void d.offsetWidth; d.classList.add('flash'); } return; }
    const s = e.target.closest('[data-speed]');
    if (s) { MAP.speed = +s.dataset.speed; $$('[data-speed]').forEach(b => b.classList.toggle('on', b === s)); }
  });
  apply();
}

      <span class="q"><b>${D.queue}</b>in queue</span></div>
    <div class="staff">${D.staff.map(s => `<span class="chip ${s.open >= s.cap ? 'full' : ''}"><i class="av">${s.n[0]}</i>${s.n}${s.owner ? ' <span class="star">★</span>' : ''}<span class="ld">${s.open} / ${s.cap} open</span></span>`).join('')}
      <button class="btn small" data-open-hiring>+ Hire</button></div>
    <div class="tasks">${D.tasks.map(t => `
      <div class="task ${t.due <= 0 ? 'hot' : ''} ${t.waiting ? 'wait' : ''}">
        <div class="tt">${t.kind} · <b>${t.cust}</b> — <span class="lane">${t.tail}</span></div>
        <div class="tm"><div class="bar"><i style="width:${Math.max(4, 100 * t.prog / t.work)}%"></i></div><span class="pg">${fmt(t.prog)} / ${t.work}</span><span class="due">${dueText(t.due)}</span></div>
      </div>`).join('')}
      ${D.queue > D.tasks.length ? `<div class="more">+${D.queue - D.tasks.length} more waiting in line</div>` : ''}
    </div>
  </div>`; }).join('');

const face = (h, i) => `<svg class="face" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="hsl(${h} 70% 86%)"/>
  <circle cx="32" cy="36" r="17" fill="#ffd9b8" stroke="#4a3226" stroke-width="2"/>
  ${['<path d="M15 33c0-12 8-18 17-18s17 6 17 18c-4-6-10-8-17-8s-13 2-17 8z" fill="hsl(' + h + ' 45% 38%)" stroke="#4a3226" stroke-width="2"/>',
     '<path d="M14 36c-2-14 6-22 18-22s20 8 18 22c-2-4-4-7-6-8-4 3-20 3-24 0-2 1-4 4-6 8z" fill="hsl(' + h + ' 40% 35%)" stroke="#4a3226" stroke-width="2"/><circle cx="32" cy="12" r="5" fill="hsl(' + h + ' 40% 35%)" stroke="#4a3226" stroke-width="2"/>',
     '<path d="M15 31c2-10 9-14 17-14s15 4 17 14l-4-2-3 3-4-3-3 3-3-3-3 3-3-3-3 3-3-3z" fill="hsl(' + h + ' 35% 55%)" stroke="#4a3226" stroke-width="2"/><circle cx="46" cy="44" r="2.6" fill="none" stroke="#4a3226" stroke-width="1.5"/>'][i]}
  <circle cx="26" cy="37" r="2.2" fill="#4a3226"/><circle cx="38" cy="37" r="2.2" fill="#4a3226"/>
  <circle cx="22" cy="42" r="3" fill="#ff9b9b" opacity=".6"/><circle cx="42" cy="42" r="3" fill="#ff9b9b" opacity=".6"/>
  <path d="M27 43q5 5 10 0" fill="none" stroke="#4a3226" stroke-width="2" stroke-linecap="round"/></svg>`;
const pips = (v, max) => { const f = Math.round(v / max * 5); return `<span class="pips">${Array.from({ length: 5 }, (_, i) => `<i class="${i < f ? 'f' : ''}"></i>`).join('')}</span>`; };
$('#cands').innerHTML = CANDIDATES.map((c, i) => `
  <div class="cand">${face(c.hue, i)}<h3>${c.n}</h3>
    <div class="stats">
      <div class="stat"><span class="l">Speed</span>${pips(c.speed, 1.5)}<span class="v">${c.speed} / day</span></div>
      <div class="stat"><span class="l">Capacity</span>${pips(c.cap, 5)}<span class="v">${c.cap} tasks</span></div>
      <div class="stat"><span class="l">Win rate</span>${pips(c.win, 75)}<span class="v">${c.win}%</span></div>
    </div>
    <div class="tag">${c.salary} <small>/ mo</small></div>
    <button class="btn">Hire!</button>
  </div>`).join('');

$('#money').innerHTML = MONEY.map(r => `<div class="row"><span>${r.l}</span><span class="v ${r.s > 0 ? 'pos' : ''}">${r.v}</span></div>`).join('')
  + `<div class="row net"><span>${MONEY_NET.l}</span><span class="v">${MONEY_NET.v}</span></div>`
  + MONEY_EXTRA.map(r => `<div class="row sub"><span>${r.l}</span><span class="v">${r.v}</span></div>`).join('');
$('#log').innerHTML = LOG.slice(0, 6).map(l => `<div class="ln ${l.c}"><span class="d">Day ${l.d}</span><span class="m">${l.m}</span></div>`).join('');

const TREES = [[100, 60], [92, 55], [-100, 52], [-110, 58], [20, 2], [25, -8], [135, -25], [-60, -8], [-55, -18], [60, 55], [35, 52], [-90, 40], [118, 45]];
const MTNS = [[-112, 42], [85, 33], [-70, -28], [100, 30], [-120, 60]];
buildMap($('#map'), {
  viewBox: { laptop: '0 62 1000 300', phone: '330 70 520 280' },
  smooth: true, orient: 'flip', rate: .01,
  decorate(svg, L) {
    svgEl('rect', { x: 0, y: 0, width: 1000, height: 500, fill: 'url(#cz-waves)' }, L.under);
    const sh = svgEl('g', { class: 'shadow' }, L.under);
    LAND.forEach(poly => svgEl('path', { d: lineD(poly) + 'Z', class: 'land-shadow' }, sh));
    LAND.forEach(poly => svgEl('path', { d: lineD(poly) + 'Z', class: 'land-sand' }, L.under));
    MTNS.forEach(([lon, lat]) => { const [x, y] = P(lon, lat); svgEl('path', { d: `M${x - 9},${y + 5} L${x},${y - 8} L${x + 9},${y + 5}Z`, class: 'mtn' }, L.over); svgEl('path', { d: `M${x - 3.5},${y - 3} L${x},${y - 8} L${x + 3.5},${y - 3} L${x + 1},${y - 4} L${x - 1},${y - 2.5}Z`, class: 'mtn-snow' }, L.over); });
    TREES.forEach(([lon, lat], i) => { const [x, y] = P(lon, lat); svgEl('rect', { x: x - .9, y: y, width: 1.8, height: 4, class: 'tree-trunk' }, L.over); svgEl('circle', { cx: x, cy: y - 1, r: 3.6, class: i % 2 ? 'tree-top' : 'tree-top2' }, L.over); });
    [[560, 120, ''], [250, 300, ' c2'], [880, 250, '']].forEach(([x, y, c]) => { const g = svgEl('g', { class: 'cloud' + c }, L.top); [[0, 0, 9], [10, -4, 11], [21, 0, 8], [10, 3, 9]].forEach(([dx, dy, r]) => svgEl('circle', { cx: x + dx, cy: y + dy, r }, g)); });
  },
  land(d, g) { svgEl('path', { d, class: 'land-main' }, g); },
  lane(id, d, g) { svgEl('path', { d, class: 'lane-halo' }, g); svgEl('path', { d, class: 'lane-dots' }, g); },
  port(p, x, y, g) { svgEl('circle', { cx: x, cy: y, r: 2.6, class: 'port' }, g); },
  pin(p, x, y, g) {
    const o = p.kind === 'office', col = o ? 'var(--office)' : 'var(--agent)';
    const pg = svgEl('g', { transform: `translate(${x},${y}) scale(.85)` }, g);
    svgEl('path', { d: 'M0,0 C-5,-7 -10,-11 -10,-18 A10,10 0 1 1 10,-18 C10,-11 5,-7 0,0Z', class: 'pin-shape', style: `fill:${col}` }, pg);
    if (o) svgEl('path', { d: 'M-5,-16 L0,-22 L5,-16 L5,-12 L-5,-12Z', fill: '#fff' }, pg);
    else { svgEl('path', { d: 'M-3,-11 L-3,-24 M-3,-24 L5,-21 L-3,-18', fill: '#fff', stroke: '#fff', 'stroke-width': 1.8, 'stroke-linejoin': 'round' }, pg); }
    const side = p.code === 'SHA' ? -1 : 1, bx = x + side * 11, by = p.code === 'SHA' ? y - 24 : y + (p.code === 'TPE' ? 2 : -2);
    const bg = svgEl('g', {}, g);
    const r = svgEl('rect', { x: bx, y: by - 1, height: 22, rx: 8, class: 'pin-bub' }, bg);
    const t = svgEl('text', { x: bx + 7, y: by + 9.5, class: 'pin-t' }, bg); t.textContent = o ? 'Your office · Taipei' : p.city;
    const s = svgEl('text', { x: bx + 7, y: by + 17.5, class: 'pin-s' }, bg); s.textContent = o ? 'that\'s you!' : 'agent: ' + p.who;
    const size = () => { const w = Math.max(t.getComputedTextLength(), getComputedStyle(s).display === 'none' ? 0 : s.getComputedTextLength()) + 14;
      const ph = document.documentElement.dataset.device === 'phone';
      r.setAttribute('height', ph ? 16 : 22); r.setAttribute('width', w);
      if (side < 0) { r.setAttribute('x', bx - w); t.setAttribute('x', bx - w + 7); s.setAttribute('x', bx - w + 7); } };
    document.fonts.ready.then(size); window.addEventListener('ff:device', size); size();
  },
  ship(s, g) {
    const r = svgEl('g', { class: 'rot' }, g), b = svgEl('g', { class: 'bob' }, r);
    svgEl('path', { d: 'M-12,3 q2,-2 4,0 M-15,1 q2,-2 4,0', class: 'wake' }, b);
    svgEl('rect', { x: -5.5, y: -4.6, width: 3.2, height: 3.2, rx: .6, fill: '#4fa3ff', stroke: '#4a3226', 'stroke-width': .6 }, b);
    svgEl('rect', { x: -2, y: -4.6, width: 3.2, height: 3.2, rx: .6, fill: '#ffcf4a', stroke: '#4a3226', 'stroke-width': .6 }, b);
    svgEl('rect', { x: 2, y: -6.5, width: 4, height: 5, rx: 1, class: 'cabin' }, b);
    svgEl('path', { d: 'M-8,-1.4 L9,-1.4 L6,3.6 L-6.5,3.6Z', class: 'hull' }, b);
  },
});
initChrome({ theme: 'light' });
</script>
</body>
</html>
