<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FF Tycoon M2 mockup</title>
<meta name="description" content="Clickable mockup of the FF Tycoon Milestone 2 Expansion screens: office switcher, Network card, Expand dialog, clickable map pins and the phone layout.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Shipped game styles, copied from src/ui/styles.css (tokens: docs/superpowers/specs/2026-11-04-visual-style.md) */
/* Design tokens for the "Cozy tycoon" style in GoFreight green.
   Source of truth: docs/superpowers/specs/2026-11-04-visual-style.md
   Visual reference: docs/mockups/2026-11-04-style-cozy-tycoon-green.html */

:root {
  /* Surfaces and text */
  --bg: #eef6ec;
  --bg-dot: #d9ecd9;
  --panel: #fffef9;
  --panel-2: #f5faf1;
  --line: #d3e7d7;
  --shadow: #b9d9c5;
  --text: #1f3a33;
  --muted: #557064;
  --track: #e0eee2;

  /* Brand green. --accent carries text (buttons, active tabs, ribbons); --brand is decoration only. */
  --accent: #207f73;
  --on-accent: #ffffff;
  --accent-shadow: #0b5e54;
  --brand: #34aa97;
  --brand-soft: #d7f1ec;

  /* Departments */
  --sales: #ff7d66;
  --sales-soft: #ffe1da;
  --ops: #f5a524;
  --ops-soft: #ffefcc;
  --accounting: #7d6be0;
  --accounting-soft: #e8e4fb;
  --on-dept: #ffffff;

  /* Good / bad (always paired with a ▲ / ▼ marker) */
  --good: #2d7414;
  --good-soft: #eaf5dd;
  --bad: #c33349;
  --bad-soft: #ffdde1;
  --on-bad: #ffffff;
  --star: #f6b500;

  /* Map */
  --sea: #a8dfe3;
  --wave: #e9fbfb;
  --land: #d6eba2;
  --land-shadow: #a9cd7e;
  --land-edge: #7fae5c;
  --sand: #f6e7b4;
  --tree: #5f9e4d;
  --tree-2: #4a8a3c;
  --tree-trunk: #9a6a44;
  --snow: #ffffff;
  --cloud: #ffffff;
  --route: #ffffff;
  --route-halo: #34aa97;
  --office: #34aa97;
  --agent: #3b82d6;
  --on-pin: #ffffff;
  --hull: #ff6f5e;
  --cabin: #ffffff;
  --cargo-1: #4fa3ff;
  --cargo-2: #ffcf4a;
  --cargo-edge: #4a3226;
  --wake: #ffffff;

  /* Type */
  --font-round: 'Fredoka', 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;

  /* Shape */
  --border: 2px;
  --radius-card: 22px;
  --radius-inner: 16px;
  --radius-btn: 12px;
  --radius-small: 8px;
  --radius-pill: 999px;
  --lift: 0 5px 0 var(--shadow);
  --lift-sm: 0 3px 0 var(--shadow);

  /* Spacing */
  --space-1: 4px;
  --space-2: 6px;
  --space-3: 8px;
  --space-4: 12px;
  --space-5: 16px;
  --space-6: 24px;
}

:root[data-theme='dark'] {
  --bg: #0a2422;
  --bg-dot: #0f2f2c;
  --panel: #113430;
  --panel-2: #163f3a;
  --line: #26564e;
  --shadow: #04120f;
  --text: #ecf7f1;
  --muted: #a0c4b8;
  --track: #0b2a27;

  --accent: #4ec1ac;
  --on-accent: #05221e;
  --accent-shadow: #207f73;
  --brand: #4ec1ac;
  --brand-soft: #123f3a;

  --sales: #ff9b87;
  --sales-soft: #4a2d33;
  --ops: #ffc35c;
  --ops-soft: #45381e;
  --accounting: #b3a4ff;
  --accounting-soft: #2f2c52;
  --on-dept: #ffffff;

  --good: #a8d96a;
  --good-soft: #243d1d;
  --bad: #ff7d91;
  --bad-soft: #52222f;
  --on-bad: #2a0910;
  --star: #f6b500;

  --sea: #16465e;
  --wave: #3f7898;
  --land: #5d8f4f;
  --land-shadow: #3c6a3c;
  --land-edge: #8fc27a;
  --sand: #b9a874;
  --tree: #3f7a45;
  --tree-2: #2f6236;
  --tree-trunk: #9a6a44;
  --snow: #ffffff;
  --cloud: #b9d6ce;
  --route: #fff1b8;
  --route-halo: #4ec1ac;
  --office: #4ec1ac;
  --agent: #6aa8ff;
  --on-pin: #ffffff;
  --hull: #ff8a78;
  --cabin: #ecf7f1;
  --cargo-1: #4fa3ff;
  --cargo-2: #ffcf4a;
  --cargo-edge: #4a3226;
  --wake: #ffffff;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
  --bg: #0a2422;
  --bg-dot: #0f2f2c;
  --panel: #113430;
  --panel-2: #163f3a;
  --line: #26564e;
  --shadow: #04120f;
  --text: #ecf7f1;
  --muted: #a0c4b8;
  --track: #0b2a27;

  --accent: #4ec1ac;
  --on-accent: #05221e;
  --accent-shadow: #207f73;
  --brand: #4ec1ac;
  --brand-soft: #123f3a;

  --sales: #ff9b87;
  --sales-soft: #4a2d33;
  --ops: #ffc35c;
  --ops-soft: #45381e;
  --accounting: #b3a4ff;
  --accounting-soft: #2f2c52;
  --on-dept: #ffffff;

  --good: #a8d96a;
  --good-soft: #243d1d;
  --bad: #ff7d91;
  --bad-soft: #52222f;
  --on-bad: #2a0910;
  --star: #f6b500;

  --sea: #16465e;
  --wave: #3f7898;
  --land: #5d8f4f;
  --land-shadow: #3c6a3c;
  --land-edge: #8fc27a;
  --sand: #b9a874;
  --tree: #3f7a45;
  --tree-2: #2f6236;
  --tree-trunk: #9a6a44;
  --snow: #ffffff;
  --cloud: #b9d6ce;
  --route: #fff1b8;
  --route-halo: #4ec1ac;
  --office: #4ec1ac;
  --agent: #6aa8ff;
  --on-pin: #ffffff;
  --hull: #ff8a78;
  --cabin: #ecf7f1;
  --cargo-1: #4fa3ff;
  --cargo-2: #ffcf4a;
  --cargo-edge: #4a3226;
  --wake: #ffffff;
    color-scheme: dark;
  }
}

body {
  margin: 0;
  background: var(--bg) radial-gradient(var(--bg-dot) 2px, transparent 2.5px) 0 0 / 22px 22px;
  color: var(--text);
  font: 600 13px/1.4 var(--font-body);
}

/* Card, buttons and the full-page screens (setup, end) */

.card {
  background: var(--panel);
  border: var(--border) solid var(--line);
  border-radius: var(--radius-card);
  box-shadow: var(--lift);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  border: var(--border) solid var(--accent);
  border-radius: var(--radius-btn);
  padding: var(--space-2) var(--space-4);
  background: var(--accent);
  color: var(--on-accent);
  font: 600 13px/1.3 var(--font-round);
  text-decoration: none;
  box-shadow: 0 3px 0 var(--accent-shadow);
  cursor: pointer;
}
.btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--accent-shadow);
}
.btn:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}
.btn-soft {
  background: var(--panel-2);
  color: var(--text);
  border-color: var(--line);
  box-shadow: var(--lift-sm);
}
.btn-soft:active {
  box-shadow: 0 1px 0 var(--shadow);
}
.btn-wide {
  width: 100%;
  padding: var(--space-3) var(--space-5);
  font-size: 15px;
}

.screen {
  box-sizing: border-box;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: var(--space-6) var(--space-5);
}
.screen-card {
  box-sizing: border-box;
  width: 100%;
  max-width: 440px;
  min-width: 0;
  padding: var(--space-6) var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  text-align: center;
  overflow-wrap: anywhere;
}
.screen-title {
  margin: 0;
  font: 700 24px/1.2 var(--font-round);
}
.screen-subtitle {
  margin: 0;
  font: 700 13px/1.4 var(--font-body);
  color: var(--muted);
}
.screen-note {
  margin: 0;
  color: var(--muted);
}

.city-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--space-4);
}

/* "Cash + Network + Customer book = total": CSS draws the + and =, so each <dd> holds only its amount. */
.breakdown {
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--space-4) var(--space-5);
}
.breakdown > div {
  min-width: 0;
}
.breakdown dt {
  font: 700 11px/1.3 var(--font-body);
  color: var(--muted);
}
.breakdown dd {
  margin: 0;
  font: 600 16px/1.3 var(--font-round);
}
.breakdown-term + .breakdown-term dd::before {
  content: '+ ';
  color: var(--muted);
}
.breakdown-total {
  flex-basis: 100%;
  padding-top: var(--space-4);
  border-top: var(--border) dotted var(--line);
}
.breakdown-total dd {
  font-size: 28px;
}
.breakdown-total dd::before {
  content: '= ';
  color: var(--muted);
}

.mode-tag {
  align-self: center;
  margin: 0;
  padding: var(--space-1) var(--space-4);
  border: var(--border) solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--panel-2);
  font: 700 11px/1.3 var(--font-body);
  color: var(--muted);
}

/* The final year's report on the end screen: label / figure rows like the year report. */
.final-year {
  padding: var(--space-4) var(--space-5);
  border: var(--border) solid var(--line);
  border-radius: var(--radius-inner);
  background: var(--panel-2);
  text-align: left;
}
.final-year-title {
  margin: 0 0 var(--space-2);
  font: 700 15px/1.3 var(--font-round);
}
.final-year .money-row dd {
  white-space: normal;
  text-align: right;
}
.final-year .is-income dd {
  color: var(--good);
}

.demo {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  padding: var(--space-5);
  border: var(--border) solid var(--brand);
  border-radius: var(--radius-inner);
  background: var(--brand-soft);
}
.demo p {
  margin: 0;
  font-weight: 700;
  color: var(--text);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.icon {
  flex: none;
  vertical-align: -4px;
}

.error {
  margin: 0;
  color: var(--bad);
  font-weight: 700;
  background: var(--panel);
}

/* Game screen layout */

.game {
  box-sizing: border-box;
  max-width: 1280px;
  min-width: 0;
  margin: 0 auto;
  padding: 14px 18px 24px;
}
/* The game root only takes focus as the last fallback after the hiring dialog closes. */
.game:focus {
  outline: none;
}
.game *,
.game *::before,
.game *::after {
  box-sizing: border-box;
}
.game-main {
  min-width: 0;
}
.game-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: var(--space-5);
  align-items: start;
}
.game-left,
.side {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

/* Fixed height: the screen is exactly the viewport, so growing queues never move the page. The top bar,
   map and tabs keep their size; the rest of the height goes to the scroll areas. */
.game.is-fixed-height {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  /* clip, where supported, also stops focus or script from scrolling the screen itself. */
  overflow: clip;
  padding-bottom: 14px;
}
.game.is-fixed-height .game-body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.game.is-fixed-height .game-main {
  flex: 1;
  min-height: 0;
}
.game.is-fixed-height .topbar,
.game.is-fixed-height .pause-banner,
.game.is-fixed-height .save-warning,
.game.is-fixed-height .map-card,
.game.is-fixed-height .tabs {
  flex: none;
}
/* Laptop: the board's columns share what's left under the map, and each task list scrolls in its column. */
.game.is-fixed-height .game-grid {
  grid-template-rows: minmax(0, 1fr);
  align-items: stretch;
}
.game.is-fixed-height .game-left,
.game.is-fixed-height .side {
  min-height: 0;
}
.game.is-fixed-height .game-left .depts {
  flex: 1;
  min-height: 0;
  grid-template-rows: auto auto minmax(0, 1fr);
}
.game.is-fixed-height .dept {
  min-height: 0;
}
.game.is-fixed-height .side .log {
  flex: 1;
  min-height: 0;
}
.game.is-fixed-height .side .log-lines {
  flex: 1;
  min-height: 0;
  max-height: none;
}
/* Phone: the open tab's panel is the one scroll area. */
.game.is-fixed-height.is-narrow .game-main {
  display: flex;
  flex-direction: column;
}
.game.is-fixed-height.is-narrow .tab-panel {
  flex: 1;
  min-height: 0;
  padding-bottom: var(--space-2);
}
.game.is-fixed-height.is-narrow .log-lines {
  max-height: none;
}
/* Phone board: the department tabs and the column header stay put; the task list scrolls. */
.game.is-fixed-height.is-narrow .tab-panel.is-board {
  overflow: hidden;
}
.game.is-fixed-height .dept-tab-panel {
  flex: 1;
  min-height: 0;
  grid-template-rows: auto auto minmax(0, 1fr);
}

/* A double-tap on a department moves the owner there, so it mustn't zoom the page instead. */
.dept,
.dept-tab {
  touch-action: manipulation;
}

/* Department tabs (phone): name and staff count on top, task count and late count under it. */
.dept-tabs {
  flex: none;
  display: flex;
  gap: var(--space-1);
}
.dept-tab {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 4px 5px;
  border: var(--border) solid var(--line);
  border-radius: 14px;
  background: var(--panel);
  color: var(--text);
  box-shadow: var(--lift-sm);
  cursor: pointer;
}
.dept-tab[aria-selected='true'] {
  background: var(--dept-soft);
  border-color: var(--dept);
  box-shadow: 0 3px 0 var(--dept);
}
.dept-tab:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}
/* The name with the staff count beside it; a long name gives way, the count never does. */
.dept-tab-head {
  max-width: 100%;
  display: flex;
  align-items: center;
  gap: 5px;
}
.dept-tab-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font: 600 13px/1.2 var(--font-round);
}
.dept-tab-staff {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  color: var(--muted);
  font: 700 11px/1 var(--font-body);
}
.dept-tab-counts {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0 6px;
  /* With their widths reserved the task and late counts take a line each, so both lines are kept
     even with no late tasks: the tabs don't grow when the first task runs late. */
  min-height: calc(2 * 1.3em);
  color: var(--muted);
  font: 700 10.5px/1.3 var(--font-body);
}
.dept-tab-late {
  color: var(--bad);
}
/* On a very short window the board would have no room left, so the page scrolls as before. */
@media (max-height: 520px) {
  .game.is-fixed-height {
    height: auto;
    overflow: visible;
  }
  .game.is-fixed-height .game-left .depts {
    grid-template-rows: none;
  }
  .game.is-fixed-height .scroll {
    overflow: visible;
  }
}

/* A scroll area: thin themed scrollbar, and focusable so arrow keys scroll it. */
.scroll {
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
/* A little room so the task cards' lift shadows aren't cut off at the list's edge. */
.dept-tasks.scroll {
  padding: 2px 4px 6px 2px;
  margin: -2px -4px -6px -2px;
}
.scroll:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
  border-radius: var(--radius-small);
}

/* World map */

.map-card {
  position: relative;
  min-width: 0;
  padding: var(--space-3);
  overflow: hidden;
}
.world-map {
  display: block;
  width: 100%;
  height: auto;
  border-radius: var(--radius-inner);
  background: var(--sea);
}
.map-sea {
  fill: var(--sea);
}
.map-wave {
  fill: none;
  stroke: var(--wave);
  stroke-width: 1.2;
  stroke-linecap: round;
  opacity: 0.7;
}
.land-shadow {
  fill: var(--land-shadow);
  transform: translateY(3px);
}
.land-sand {
  fill: none;
  stroke: var(--sand);
  stroke-width: 5;
  stroke-linejoin: round;
}
.land-main {
  fill: var(--land);
  stroke: var(--land-edge);
  stroke-width: 1.6;
  stroke-linejoin: round;
}
.mtn {
  fill: var(--land-shadow);
  stroke: var(--land-edge);
  stroke-width: 1;
  stroke-linejoin: round;
}
.mtn-snow {
  fill: var(--snow);
}
.tree-trunk {
  fill: var(--tree-trunk);
}
.tree-top {
  fill: var(--tree);
}
.tree-top-2 {
  fill: var(--tree-2);
}
.route-halo {
  fill: none;
  stroke: var(--route-halo);
  stroke-width: 6;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.45;
}
.route-dots {
  fill: none;
  stroke: var(--route);
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 0.1 6.5;
}
.port {
  fill: var(--panel);
  stroke: var(--text);
  stroke-width: 1.2;
}
.port-label {
  font: 600 8px var(--font-round);
  fill: var(--text);
  stroke: var(--panel);
  stroke-width: 2.4px;
  stroke-linejoin: round;
  paint-order: stroke;
}
.pin-shape {
  stroke: var(--text);
  stroke-width: 1.3;
}
.pin-house {
  fill: var(--on-pin);
}
.pin-flag {
  fill: var(--on-pin);
  stroke: var(--on-pin);
  stroke-width: 1.8;
  stroke-linejoin: round;
}
.pin-bubble {
  fill: var(--panel);
  stroke: var(--text);
  stroke-width: 1.2;
}
.pin-city {
  font-family: var(--font-round);
  font-weight: 600;
  fill: var(--text);
}
.pin-sub {
  font-family: var(--font-body);
  font-weight: 700;
  fill: var(--muted);
}
.ship-bob {
  animation: ship-bob 2.6s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: 50% 80%;
}
.ship:nth-child(2n) .ship-bob {
  animation-delay: -1.3s;
}
@keyframes ship-bob {
  0%,
  100% {
    transform: translateY(0) rotate(-4deg);
  }
  50% {
    transform: translateY(-1.4px) rotate(4deg);
  }
}
.ship-hull {
  fill: var(--hull);
  stroke: var(--text);
  stroke-width: 0.9;
  stroke-linejoin: round;
}
.ship-cabin {
  fill: var(--cabin);
  stroke: var(--text);
  stroke-width: 0.8;
}
.ship-cargo-1,
.ship-cargo-2 {
  stroke: var(--cargo-edge);
  stroke-width: 0.6;
}
.ship-cargo-1 {
  fill: var(--cargo-1);
}
.ship-cargo-2 {
  fill: var(--cargo-2);
}
.ship-wake {
  fill: none;
  stroke: var(--wake);
  stroke-width: 1.1;
  stroke-linecap: round;
  opacity: 0.8;
}
.cloud {
  fill: var(--cloud);
  opacity: 0.85;
  animation: cloud-drift 60s linear infinite alternate;
}
.cloud.is-reverse {
  animation-duration: 80s;
  animation-direction: alternate-reverse;
}
@keyframes cloud-drift {
  to {
    transform: translateX(60px);
  }
}
.map-tag,
.map-legend {
  position: absolute;
  display: flex;
  align-items: center;
  background: var(--panel);
  border: var(--border) solid var(--line);
  border-radius: var(--radius-pill);
}
.map-tag {
  left: 20px;
  top: 18px;
  gap: var(--space-2);
  padding: 3px 12px 3px 8px;
  font: 600 12.5px var(--font-round);
  box-shadow: var(--lift-sm);
}
.map-tag-icon {
  display: inline-flex;
  color: var(--hull);
}
.map-legend {
  right: 20px;
  bottom: 18px;
  gap: 10px;
  padding: 3px 12px;
  font: 700 11px var(--font-body);
  color: var(--muted);
}
.map-legend span {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}
.map-legend i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.map-legend .is-office {
  background: var(--office);
}
.map-legend .is-agent {
  background: var(--agent);
}
.map-card.is-compact {
  padding: 5px;
  border-radius: 18px;
}
.map-card.is-compact .world-map {
  border-radius: 13px;
}
.map-card.is-compact .map-tag {
  left: 10px;
  top: 9px;
  padding: 1px 8px 1px 5px;
  font-size: 10.5px;
}
.map-card.is-compact .map-legend {
  right: 10px;
  bottom: 9px;
  gap: 7px;
  padding: 1px 8px;
  font-size: 9.5px;
}

/* Top bar */

.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 14px;
  min-width: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-right: 2px;
  font: 700 20px/1 var(--font-round);
  white-space: nowrap;
}
.logo {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--accent);
  color: var(--on-accent);
  box-shadow: 0 3px 0 var(--accent-shadow);
}
.pill {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  padding: 5px 10px;
  background: var(--panel);
  border: var(--border) solid var(--line);
  border-radius: var(--radius-inner);
  box-shadow: var(--lift-sm);
}
.pill b {
  display: block;
  font: 600 16px/1.1 var(--font-round);
  white-space: nowrap;
}
.pill small {
  display: block;
  font: 700 10.5px/1.2 var(--font-body);
  color: var(--muted);
}
.pill small.is-good {
  color: var(--good);
}
.pill small.is-bad {
  color: var(--bad);
}
.pill small.is-good::before {
  content: '▲ ';
}
.pill small.is-bad::before {
  content: '▼ ';
}
.pill-date {
  flex-direction: row;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-2) var(--space-3);
}
.pill-date b {
  white-space: normal;
}
.speed {
  display: flex;
  gap: var(--space-1);
}
.speed-btn {
  min-width: 32px;
  height: 28px;
  padding: 0 var(--space-2);
  border: var(--border) solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  color: var(--text);
  box-shadow: var(--lift-sm);
  font: 700 13px/1 var(--font-round);
  cursor: pointer;
}
.speed-btn[aria-pressed='true'] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
  box-shadow: 0 3px 0 var(--accent-shadow);
}
.speed-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow: none;
}
.speed-btn:focus-visible,
.gear:focus-visible,
.chip:focus-visible,
.dept-here:focus-visible,
.tab:focus-visible,
.close:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}
.gear {
  flex: none;
  width: 40px;
  height: 40px;
  margin-left: auto;
  display: grid;
  place-items: center;
  border: var(--border) solid var(--line);
  border-radius: var(--radius-btn);
  background: var(--panel);
  color: var(--text);
  box-shadow: var(--lift-sm);
  cursor: pointer;
}
/* The keyboard-shortcuts button sits just before the gear and takes the gear's push to the right. */
.help-btn + .gear {
  margin-left: 0;
}
.gear:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--shadow);
}

/* Pause banner */

.pause-banner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-4);
  margin-bottom: 14px;
  padding: var(--space-4) var(--space-5);
  border-color: var(--brand);
  background: var(--brand-soft);
}
.save-warning {
  margin: 0 0 14px;
  padding: var(--space-3) var(--space-5);
  border-color: var(--bad);
  background: var(--bad-soft);
}
/* Over the end-of-run celebration (.end-fx), under the end screen fading in (.end-reveal, later in the page). */
.save-warning.is-raised {
  position: relative;
  z-index: 41;
}
.end-save-warning,
.load-warning {
  margin: 0;
  padding: var(--space-3) var(--space-4);
  border: var(--border) solid var(--bad);
  border-radius: var(--radius-btn);
  background: var(--bad-soft);
}
/* The warning and its retry button, side by side when there's room. */
.end-save-warning {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3) var(--space-4);
}
.end-save-warning p {
  flex: 1 1 220px;
  margin: 0;
}
.pause-reasons {
  flex: 1 1 200px;
  min-width: 0;
  margin: 0;
  padding: 0;
  list-style: none;
  font-weight: 700;
  overflow-wrap: anywhere;
}

/* Departments */

/* Each column shares the board's rows (head, staff, tasks) through subgrid, so the task cards
   start at the same height in every column however tall its header or staff row is. */
.depts {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.dept {
  min-width: 0;
  padding: 12px 12px 14px;
  display: grid;
  grid-row: span 3;
  grid-template-rows: subgrid;
  row-gap: 10px;
  align-content: start;
}
.dept-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
  min-width: 0;
}
.dept-tools {
  flex-basis: 100%;
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  min-height: 28px;
}
.btn-small {
  padding: 3px 10px;
  font-size: 12px;
}
.dept-here {
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  background: var(--dept-soft);
  color: var(--text);
  font: 700 12px/1.4 var(--font-body);
}
.dept-here .star {
  font-size: 12px;
}
.dept-late {
  margin-left: auto;
  padding: 1px 8px;
  border-radius: var(--radius-pill);
  background: var(--bad);
  color: var(--on-bad);
  font: 800 11px/1.5 var(--font-body);
  white-space: nowrap;
}
.dept-tasks {
  min-width: 0;
}
.dept-badge {
  flex: none;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: var(--dept-soft);
  color: var(--dept);
}
.dept-name {
  min-width: 0;
}
.dept-name h2 {
  margin: 0;
  font: 700 17px/1.2 var(--font-round);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dept-name small {
  display: block;
  font: 700 11px/1.3 var(--font-body);
  color: var(--muted);
}
.dept-queue {
  margin-left: auto;
  text-align: right;
  font: 700 11px/1.2 var(--font-body);
  color: var(--muted);
}
.dept-queue b {
  display: block;
  font: 600 16px/1.1 var(--font-round);
  color: var(--text);
}
.dept-empty {
  margin: 0;
  padding: var(--space-3) var(--space-4);
  border: var(--border) dashed var(--line);
  border-radius: var(--radius-inner);
  color: var(--muted);
}
/* The staff row is compact: avatar and load only, at most two lines (a big team scrolls inside it).
   The padding keeps keyboard focus rings inside the scroll box. */
.staff-wrap {
  position: relative;
  min-width: 0;
}
/* At most two lines of chips (StaffRow works out how many fit, with a "+N" for the rest), never a
   scroll box. Chip widths are fixed so that count matches what is drawn; StaffRow sets the variables. */
.staff {
  --chip-h: 26px;
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: var(--chip-gap, 6px);
  margin: calc(-1 * var(--space-1));
  padding: var(--space-1);
  list-style: none;
}
.chip {
  width: var(--chip-w, 64px);
  height: var(--chip-h);
  display: flex;
  align-items: center;
  gap: var(--space-1);
  padding: 2px 4px 2px 2px;
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--dept-soft);
  color: var(--text);
  font: 700 11px/1 var(--font-body);
  cursor: pointer;
}
.chip.is-owner {
  width: var(--chip-owner-w, 76px);
}
.chip-more {
  width: var(--chip-more-w, 40px);
  justify-content: center;
  padding: 2px 6px;
  background: var(--panel);
  border: var(--border) solid var(--dept-soft);
  color: var(--muted);
  font-weight: 800;
}
/* The whole department's staff, opened from "+N": the stats card per person, scrolling if long. */
/* Placed by StaffRow (fixed, next to the row, sized to the room the window has). */
.staff-pop.staff-list {
  z-index: 6;
  width: 100%;
}
.staff-list:focus {
  outline: none;
}
.staff-list ul {
  display: grid;
  gap: var(--space-3);
  margin: 0;
  padding: 0;
  list-style: none;
}
.staff-list li + li {
  padding-top: var(--space-3);
  border-top: var(--border) dotted var(--line);
}
.chip[aria-expanded='true'] {
  box-shadow: 0 0 0 var(--border) var(--dept);
}
.avatar {
  flex: none;
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border: var(--border) solid var(--panel);
  border-radius: 50%;
  background: var(--dept);
  color: var(--on-dept);
  font: 600 11px/1 var(--font-round);
}
.staff-pop {
  position: absolute;
  z-index: 5;
  top: calc(100% + var(--space-2));
  left: 0;
  width: min(220px, 100%);
  padding: 10px 12px;
  background: var(--panel);
  border: var(--border) solid var(--dept);
  border-radius: var(--radius-inner);
  box-shadow: var(--lift-sm);
}
.staff-pop h3 {
  margin: 0 0 6px;
  font: 600 15px/1.2 var(--font-round);
  overflow-wrap: anywhere;
}
.staff-stats {
  display: grid;
  grid-template-columns: auto auto;
  justify-content: space-between;
  gap: 3px var(--space-4);
  margin: 0;
  font-size: 12px;
}
.staff-stats dt {
  color: var(--muted);
  font-weight: 700;
}
.staff-stats dd {
  margin: 0;
  text-align: right;
  font: 600 12.5px/1.3 var(--font-round);
}
.star {
  color: var(--star);
  font-size: 14px;
}
.chip .star {
  font-size: 11px;
  margin: 0 -2px;
}
.chip-load {
  flex: none;
  padding: 2px 6px;
  border-radius: var(--radius-pill);
  background: var(--panel);
  color: var(--muted);
  font: 700 11px/1.2 var(--font-round);
  white-space: nowrap;
}
/* Bolder by a stroke, not a heavier weight, so "2/3" → "3/3" keeps its width. */
.chip.is-full .chip-load {
  color: var(--bad);
  -webkit-text-stroke: 0.35px currentColor;
}
.tasks {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  margin: 0;
  padding: 0;
  list-style: none;
}
.task {
  min-width: 0;
  padding: 8px 10px 9px;
  background: var(--panel-2);
  border: var(--border) solid var(--line);
  border-radius: var(--radius-inner);
}
.task.is-waiting {
  opacity: 0.62;
}
.task.is-hot {
  border-color: var(--bad);
  background: var(--bad-soft);
  opacity: 1;
}
.task-title {
  font-size: 12.5px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.task-meta {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-top: 7px;
}
.bar {
  flex: 1;
  min-width: 24px;
  height: 10px;
  overflow: hidden;
  border-radius: var(--radius-pill);
  background: var(--track);
}
.bar i {
  display: block;
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--dept)
    repeating-linear-gradient(
      -45deg,
      color-mix(in srgb, var(--on-dept) 28%, transparent) 0 5px,
      transparent 5px 10px
    );
}
.task-progress {
  font: 600 12.5px/1 var(--font-round);
  white-space: nowrap;
}
.due {
  padding: 1px 8px;
  border-radius: var(--radius-pill);
  background: var(--panel);
  color: var(--muted);
  font: 700 11px/1.4 var(--font-body);
  white-space: nowrap;
}
.due.is-due {
  background: var(--bad);
  color: var(--on-bad);
  animation: wiggle 1.6s ease-in-out infinite;
}
@keyframes wiggle {
  0%,
  80%,
  100% {
    transform: rotate(0);
  }
  85% {
    transform: rotate(-6deg);
  }
  90% {
    transform: rotate(6deg);
  }
  95% {
    transform: rotate(-3deg);
  }
}

/* Side panel */

.side-card {
  min-width: 0;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  overflow-wrap: anywhere;
}
.side-card h2 {
  margin: 0;
  font: 700 17px/1.2 var(--font-round);
}
.side-hint {
  margin: 0;
  color: var(--muted);
}
.side-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
}
.side-buttons .btn {
  flex: 1 1 auto;
}
.money-rows {
  margin: 0;
}
.money-row {
  display: flex;
  justify-content: space-between;
  gap: var(--space-3);
  padding: 5px 0;
  font-size: 12.5px;
}
.money-row dd {
  margin: 0;
  font: 600 13.5px/1.3 var(--font-round);
  white-space: nowrap;
}
.money-row dd.is-good {
  color: var(--good);
}
.money-net {
  margin: var(--space-2) 0;
  padding: var(--space-3) 10px;
  border-radius: 14px;
  background: var(--good-soft);
  font-weight: 800;
}
.money-net.is-bad {
  background: var(--bad-soft);
  color: var(--text);
}
.money-net.is-good {
  color: var(--text);
}
.money-net dd {
  font-size: 16px;
}
.money-net.is-good dd {
  color: var(--good);
}
.money-net.is-bad dd {
  /* --bad on --bad-soft is too faint for text, so the bad total keeps the body color and its ▼. */
  color: var(--text);
}
.money-net.is-good dd::before {
  content: '▲ ';
}
.money-net.is-bad dd::before {
  content: '▼ ';
  color: var(--bad);
}
.money-sub {
  color: var(--muted);
}
.log-lines {
  margin: 0;
  padding: 0;
  list-style: none;
  max-height: 360px;
  overflow-y: auto;
}
.log-line {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: 7px 0;
  border-bottom: var(--border) dotted var(--line);
  font-size: 12.5px;
}
.log-line:last-child {
  border-bottom: 0;
}
.log-day {
  flex: none;
  padding: 0 6px;
  border: var(--border) solid var(--line);
  border-radius: var(--radius-small);
  background: var(--panel-2);
  color: var(--muted);
  font: 600 11px/1.5 var(--font-round);
  white-space: nowrap;
}
.log-msg {
  min-width: 0;
}
.log-line.is-good .log-msg::before {
  content: '▲ ';
  color: var(--good);
}
.log-line.is-bad .log-msg::before {
  content: '▼ ';
  color: var(--bad);
}
.log-line.is-info .log-msg::before {
  content: '● ';
  color: var(--agent);
}
.settings {
  display: grid;
  gap: var(--space-2);
}
.settings label {
  font-weight: 700;
  color: var(--muted);
}
.settings select {
  width: 100%;
  min-width: 0;
  margin-bottom: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: var(--border) solid var(--line);
  border-radius: var(--radius-btn);
  background: var(--panel-2);
  color: var(--text);
  font: 600 13px/1.3 var(--font-body);
}
.settings-check {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.settings-check input {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
}
.settings-check label {
  color: var(--text);
}

/* Hiring dialog */

.dialog-backdrop {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: start center;
  padding: var(--space-5);
  overflow-y: auto;
  background: color-mix(in srgb, var(--text) 40%, transparent);
}
/* Auto margins center the dialog, and drop to zero when it's taller than the screen, so its top
   never scrolls out of reach the way a centered grid item's would. */
.dialog-backdrop > [role='dialog'] {
  margin-block: auto;
}
.hire {
  width: 100%;
  max-width: 720px;
  min-width: 0;
  padding: 0 18px 18px;
  border-color: var(--brand);
  outline: none;
}
.ribbon {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  margin: 0 -18px 14px;
  padding: 12px 18px;
  border-radius: 19px 19px 0 0;
  background: var(--accent);
  color: var(--on-accent);
}
.ribbon-text {
  flex: 1;
  min-width: 0;
}
.ribbon h2 {
  margin: 0;
  font: 700 19px/1.2 var(--font-round);
}
.ribbon p {
  margin: 0;
  font-weight: 700;
}
.close {
  flex: none;
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 50%;
  background: color-mix(in srgb, var(--on-accent) 25%, transparent);
  color: var(--on-accent);
  font: 700 15px/1 var(--font-round);
  cursor: pointer;
}
.cands {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.cand {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
  padding: 12px;
  background: var(--panel-2);
  border: var(--border) solid var(--line);
  border-radius: 20px;
  text-align: center;
}
.cand-avatar {
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  border: var(--border) solid var(--line);
  border-radius: 50%;
  background: var(--dept);
  color: var(--on-dept);
  font: 600 24px/1 var(--font-round);
}
/* A hired candidate's slot keeps the card's layout, invisible, so it is exactly the size it was. */
.cand.is-hired {
  position: relative;
  border-style: dashed;
  background: var(--panel);
}
.cand-ghost {
  display: contents;
  visibility: hidden;
}
.cand-hired {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  padding: 12px;
}
.cand-hired .cand-avatar {
  background: var(--track);
  color: var(--muted);
}
.cand-hired p {
  margin: 0;
  max-width: 100%;
  font: 700 14px/1.3 var(--font-round);
  color: var(--good);
  overflow-wrap: break-word;
}
.cand h3 {
  margin: 0;
  max-width: 100%;
  font: 600 16px/1.2 var(--font-round);
  overflow-wrap: anywhere;
}
.stats {
  width: 100%;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.stat {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px var(--space-3);
  font-size: 12px;
  text-align: left;
}
.stat dt {
  flex: 1 1 auto;
  color: var(--muted);
  font-weight: 700;
}
.stat dd {
  margin: 0;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.pips {
  display: flex;
  gap: 3px;
}
.pips i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--track);
}
.pips i.on {
  background: var(--dept);
}
.stat-value {
  font: 600 12.5px/1.2 var(--font-round);
  white-space: nowrap;
}
.salary {
  padding: 3px 12px;
  border: var(--border) dashed var(--line);
  border-radius: var(--radius-btn);
  background: var(--panel);
  font: 600 15px/1.3 var(--font-round);
  white-space: nowrap;
}
.cand .btn {
  width: 100%;
  padding: var(--space-3);

/* Year report and settings: a narrow card with the same ribbon */

/* Keyboard shortcuts help */

.hotkeys + .hotkeys {

}
.hotkeys h3 {

  color: var(--muted);

}
.hotkeys dl {

  gap: var(--space-2);
  margin: 0;
}
.hotkey-row {
  display: grid;
  /* One fixed key column, so the descriptions line up across every group; it fits "⇧S ⇧O ⇧A". */
  grid-template-columns: 136px minmax(0, 1fr);
  align-items: center;
  gap: var(--space-3);
}
.hotkey-row dt {

}
.hotkey-row dd {
  margin: 0;

}
/* A key as a keycap (Kbd.tsx): a small rounded box with a pressed-in bottom edge. */
kbd {
  display: inline-block;
  min-width: 26px;
  padding: 3px 7px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel-2);
  color: var(--text);
  box-shadow: 0 2px 0 var(--shadow);
  font: 800 12px/1.2 var(--font-body);
  text-align: center;
  white-space: nowrap;
}
/* Keys pressed together (Kbd.tsx Combo): the outer kbd only groups its keycaps, close together. */
kbd.kbd-combo,
.tooltip kbd.kbd-combo {
  display: inline-flex;
  gap: 2px;
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  box-shadow: none;
}
/* In the shortcut list a combination is one keycap, "⇧S", so three of them fit the key column. */
.hotkey-row kbd.kbd-combo {
  gap: 1px;
  justify-content: center;
  min-width: 26px;
  padding: 3px 6px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  box-shadow: 0 2px 0 var(--shadow);
}
.hotkey-row .kbd-combo kbd {
  min-width: 0;
  padding: 0;
  border: 0;
  background: none;
  box-shadow: none;
}

/* Numbers that change during play. Fredoka's digits differ in width (a "1" is narrower than a "3"),
   so these use the body font, whose digits are all one width; size and weight stay as they were. */
.game .num {
  font-family: var(--font-body);
  font-variant-numeric: tabular-nums lining-nums;
}
/* A number that changes all the time during play keeps a box as wide as its widest realistic value,
   with the number right-aligned in it, so a new digit or decimal ("9" → "10", "0.9" → "1.0",
   "$999,999" → "$1,000,000") never moves what is around it. `--w` is that value's width in `ch` (one
   digit of the body font, which every digit here is as wide as); words and signs next to a number are
   wider than a digit, so their counts are measured. The extra pixel covers sub-pixel rounding.
   The top bar's staff count gets a box too: it sits among the boxed numbers, so its pill shouldn't
   grow when the team reaches 10. Badges and labels that change now and then (late counts, due labels,
   queue and department staff counts, chip load) have no box: they hug their text, and only grow when a digit is added. */
.game :is(.num-cash, .num-flow, .num-year, .num-day, .num-rate, .num-perop, .num-staff, .num-progress) {
  min-inline-size: calc(var(--w) * 1ch + 1px);
  text-align: end;
}
/* The date's year and day sit inside a sentence ("Year 1 of 10 · Day 40"), so each box starts right
   after its word; the room for more digits is on the far side, where the sentence goes on. */
.game :is(.num-year, .num-day) {
  display: inline-block;
  text-align: start;
}
.game .num-cash {
  --w: 11; /* −$9,999,999 */
}
.game .num-flow {
  --w: 15; /* ▼ −$99,999 / mo */
}
.game .num-year {
  --w: 2; /* 10 */
}
.game .num-day {
  --w: 4; /* 3600 */
}
.game .num-rate {
  --w: 5; /* 100% */
}
.game .num-perop {
  --w: 4; /* 99.9 */
}
.game .num-staff {
  --w: 3; /* 999 */
}
.game .num-progress {
  --w: 9; /* 9.9 / 9.9 */
}
/* In a pill the value keeps its own box rather than stretching to the label under it. */
.pill:not(.pill-date) > .num {
  align-self: flex-start;
}

/* A button's tooltip (Tooltip.tsx). The wrapper takes the button's place in the layout and the hover,
   also for a disabled button; the tooltip floats over everything and never changes the layout. */
.tip {
  display: inline-flex;
  flex: none;
}
.tip > :disabled {
  pointer-events: none;
}
.tip-block {
  display: flex;
  width: 100%;
}
.tip-grow,
.tip-grow > .btn {
  flex: 1 1 auto;
}
.topbar .tip-gear {
  margin-left: auto;
}
.topbar .tip-help + .tip-gear,
.tip > .gear {
  margin-left: 0;
}
.game.is-narrow .tip-gear {
  order: -1;
}
.tooltip {
  position: fixed;
  z-index: 30;
  /* Room for the longest one-line hint, the Chinese hire buttons' keys; it wraps only on a narrow window. */
  max-width: min(380px, calc(100vw - 16px));
  padding: 6px 10px;
  border-radius: var(--radius-small);
  background: var(--text);
  color: var(--panel);
  box-shadow: var(--lift-sm);
  font: 700 12px/1.35 var(--font-body);
  white-space: pre-line;
  overflow-wrap: anywhere;
  pointer-events: none;
}
.tooltip[hidden] {
  display: none;
}
.tooltip-hint {
  display: block;
  margin-top: 2px;
}
/* The tooltip is the inverse of the page (text color on panel color), so its keycaps are too. */
.tooltip kbd {
  min-width: 18px;
  margin-block: -1px;
  padding: 0 5px;
  border-color: var(--muted);
  border-radius: 5px;
  background: var(--panel);
  color: var(--text);
  box-shadow: 0 1px 0 var(--muted);
  font-size: 11px;
  line-height: 16px;
}

/* Read by screen readers only. */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* End of a run: the frozen board under fireworks or the Closed stamp, then the end screen fades in. */

.end-fx {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: var(--space-5);
  overflow: hidden;
  background: color-mix(in srgb, var(--bg) 55%, transparent);
  cursor: pointer;
  animation: end-fade-in 300ms ease-out both;
}
.end-fx.is-bankrupt {
  backdrop-filter: grayscale(0.8);
}
.end-caption {
  position: relative;
  max-width: 100%;
  padding: var(--space-4) var(--space-6);
  border: var(--border) solid var(--brand);
  border-radius: var(--radius-pill);
  background: var(--panel);
  box-shadow: var(--lift);
  color: var(--text);
  font: 700 clamp(22px, 5vw, 34px) / 1.2 var(--font-round);
  text-align: center;
  overflow-wrap: anywhere;
  animation: end-caption-pop 500ms cubic-bezier(0.3, 1.5, 0.5, 1) 150ms both;
}
@keyframes end-caption-pop {
  from {
    opacity: 0;
    transform: scale(0.6);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* A burst is a point; its sparks fly out from it along their angle and fade. */
.fx-burst {
  --fx: var(--brand);
  --fx-r: clamp(64px, 16vw, 150px);
  position: absolute;
  width: 0;
  height: 0;
}
.fx-burst:nth-child(6n + 2) {
  --fx: var(--sales);
}
.fx-burst:nth-child(6n + 3) {
  --fx: var(--ops);
}
.fx-burst:nth-child(6n + 4) {
  --fx: var(--accounting);
}
.fx-burst:nth-child(6n + 5) {
  --fx: var(--star);
}
.fx-burst:nth-child(6n) {
  --fx: var(--agent);
}
.fx-burst::before {
  content: '';
  position: absolute;
  left: -14px;
  top: -14px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--fx);
  opacity: 0;
  animation: fx-flash 450ms ease-out var(--fx-delay) forwards;
}
.fx-spark {
  position: absolute;
  left: -2.5px;
  top: -9px;
  width: 5px;
  height: 18px;
  border-radius: var(--radius-pill);
  background: var(--fx);
  opacity: 0;
  animation: fx-spark 1000ms cubic-bezier(0.15, 0.7, 0.3, 1) var(--fx-delay) forwards;
}
@keyframes fx-flash {
  0% {
    opacity: 0.9;
    transform: scale(0.2);
  }
  100% {
    opacity: 0;
    transform: scale(1.6);
  }
}
@keyframes fx-spark {
  0% {
    opacity: 1;
    transform: rotate(var(--fx-angle)) translateY(-4px) scaleY(0.4);
  }
  60% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: rotate(var(--fx-angle)) translateY(calc(-1 * var(--fx-r))) scaleY(0.7);
  }
}

/* A rubber stamp that drops onto the board and settles at a slant. */
.end-stamp {
  max-width: 100%;
  padding: var(--space-3) var(--space-6);
  border: 5px solid var(--bad);
  border-radius: var(--radius-btn);
  outline: 2px solid var(--bad);
  outline-offset: 4px;
  background: var(--panel);
  box-shadow: var(--lift);
  color: var(--bad);
  font: 700 clamp(40px, 11vw, 72px) / 1 var(--font-round);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  overflow-wrap: anywhere;
  transform: rotate(-10deg);
  animation: end-stamp-drop 700ms cubic-bezier(0.2, 0.8, 0.3, 1) 150ms both;
}
@keyframes end-stamp-drop {
  0% {
    opacity: 0;
    transform: rotate(-22deg) scale(2.6);
  }
  55% {
    opacity: 1;
    transform: rotate(-8deg) scale(0.92);
  }
  75% {
    transform: rotate(-11deg) scale(1.04);
  }
  100% {
    opacity: 1;
    transform: rotate(-10deg) scale(1);
  }
}
.end-fx.is-still,
.end-fx.is-still .end-caption,
.end-fx.is-still .end-stamp {
  animation: none;
}

/* The end screen fading in over the celebration; it has the page's own background, so it covers the board. */
.end-reveal {
  position: fixed;
  inset: 0;
  z-index: 41;
  overflow-y: auto;
  background: var(--bg) radial-gradient(var(--bg-dot) 2px, transparent 2.5px) 0 0 / 22px 22px;
  pointer-events: none;
  animation: end-fade-in 600ms ease-in-out both;
}
.end-reveal.is-quick {
  animation-duration: 300ms;
}
@keyframes end-fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
/* Focus lands on the end screen's heading so it's read first; it isn't a control, so no ring. */
.screen-title:focus {
  outline: none;
}

@media (prefers-reduced-motion: reduce) {
  .btn:active {
    transform: none;
  }
  .due.is-due {
    animation: none;
  }
  .ship-bob,
  .cloud {
    animation: none;
  }
  .end-caption,
  .end-stamp,
  .fx-burst::before,
  .fx-spark {
    animation: none;
  }
}

/* ===== M2 mockup additions (new surfaces) — built on the shipped tokens above ===== */

/* Blue "Sign agent" button, in the agent pin's color but dark enough to carry text:
   white on #2563b8 is 5.9:1 (light); #06203d on #6aa8ff is 6.8:1 (dark). The green "Open office" button is the
   shipped accent button (4.8:1 light, 7.6:1 dark). */
:root {
  --agent-strong: #2563b8;
  --on-agent-strong: #ffffff;
  --agent-strong-shadow: #173f78;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --agent-strong: #6aa8ff;
    --on-agent-strong: #06203d;
    --agent-strong-shadow: #2563b8;
  }
}
:root[data-theme='dark'] {
  --agent-strong: #6aa8ff;
  --on-agent-strong: #06203d;
  --agent-strong-shadow: #2563b8;
}

  stroke-width: 2.4;
}
.world-map g[data-port]:focus {
  outline: none;
}
.pin.is-viewed .pin-bubble {
  stroke: var(--accent);
  stroke-width: 2.2;
}
.pin-ring {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  stroke-dasharray: 3 3;
}
.map-card {
  position: relative;
}
/* On the phone the popup may hang below the small map, over the tabs; the strip keeps its own clipping. */
.map-card.is-compact {
  overflow: visible;
  z-index: 3;
}
.map-strip {
  overflow-x: auto;
  overflow-y: hidden;
  border-radius: var(--radius-inner);
  scrollbar-width: thin;
}
.map-strip .world-map {
  width: 160%;
  max-width: none;
}
.swipe-hint {
  position: absolute;
  right: 12px;
  top: 10px;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  background: var(--panel);
  border: var(--border) solid var(--line);
  font: 700 11px/1.5 var(--font-body);
  color: var(--muted);
  pointer-events: none;
}

/* Pin popup */
.pin-pop {
  position: absolute;
  z-index: 5;
  width: max-content;
  min-width: 220px;
  max-width: calc(100% - 16px);
  padding: 12px;
  border: var(--border) solid var(--brand);
  border-radius: var(--radius-inner);
  background: var(--panel);
  box-shadow: var(--lift);
}
.pin-pop h3 {
  margin: 0;
  padding-right: 28px;
  font: 700 16px/1.2 var(--font-round);
}
.pin-pop h3 small {
  font: 700 12px/1 var(--font-body);
  color: var(--muted);
}
/* One line per button, whatever the language: the popup grows to fit instead. */
.pop-btn {
  white-space: nowrap;
}
.pop-btn {
  width: 100%;
}
.btn.btn-agent {
  border-color: var(--agent-strong);
  background: var(--agent-strong);
  color: var(--on-agent-strong);
  box-shadow: 0 3px 0 var(--agent-strong-shadow);
}
.btn.btn-agent:active {
  box-shadow: 0 1px 0 var(--agent-strong-shadow);
}
.pop-rent {
  margin: -2px 0 0;
  text-align: center;
  font: 700 12px/1.3 var(--font-body);
  color: var(--muted);
}
.pop-msg {
  margin: 6px 0 0;
  font: 800 12.5px/1.35 var(--font-body);
}
.pop-msg.is-good {
  margin: 0 0 8px;
  color: var(--good);
}
.pop-msg.is-bad {
  color: var(--bad);
}
.legend-regions {
  font-weight: 800;
}
.pin-leader {
  stroke: var(--text);
  stroke-width: 1;
  stroke-dasharray: 2 2;
  fill: none;
}
.pin-hit {
  fill: transparent;
  cursor: pointer;
}
.pin-pop .pop-sub {
  margin: 2px 0 8px;
  color: var(--muted);
  font-weight: 700;
}
.pin-pop .pop-actions {
  display: grid;
  gap: var(--space-2);
}
.pin-pop .pop-close {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 26px;
  height: 26px;
  border: 0;
  border-radius: 50%;
  background: var(--panel-2);
  color: var(--text);
  font: 700 13px/1 var(--font-round);
  cursor: pointer;
}
.pop-note {
  margin: 6px 0 0;
  font: 600 12px/1.35 var(--font-body);
  color: var(--muted);
}

.new-flag {
  margin-left: 6px;
  padding: 0 6px;
  border-radius: var(--radius-pill);
  background: var(--brand-soft);
  color: var(--text);
  font: 800 10px/1.6 var(--font-body);
  text-transform: uppercase;
}

/* Mockup controls (not part of the game) */
.mock-fab {
  position: fixed;
  left: max(12px, env(safe-area-inset-left, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}
.mock-toggle {
  padding: 6px 12px;
  border: 2px dashed var(--accent);
  border-radius: var(--radius-pill);
  background: var(--panel);
  color: var(--text);
  font: 800 12px/1.2 var(--font-body);
  cursor: pointer;
}
.mock-panel {
  width: min(330px, calc(100vw - 24px));
  max-height: min(70vh, 560px);
  overflow-y: auto;
  padding: 12px 14px;
  border: 2px dashed var(--accent);
  border-radius: var(--radius-inner);
  background: var(--panel);
  color: var(--text);
  box-shadow: var(--lift);
  font: 600 12.5px/1.4 var(--font-body);
}
.mock-panel h2 {
  margin: 0 0 4px;
  font: 700 16px/1.2 var(--font-round);
}
.mock-panel h3 {
  margin: 10px 0 4px;
  font: 800 11px/1.2 var(--font-body);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.mock-seg {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.mock-seg button,
.mock-states button {
  padding: 4px 9px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--panel-2);
  color: var(--text);
  font: 700 12px/1.3 var(--font-body);
  cursor: pointer;
}
.mock-seg button[aria-pressed='true'] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}
.mock-states {
  display: grid;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.mock-states button {
  width: 100%;
  text-align: left;
  border-radius: var(--radius-small);
}
.mock-panel p {
  margin: 4px 0 0;
  color: var(--muted);
}

</style>

      ${staff.length ? `<div class="staff-wrap"><ul class="staff" style="--chip-w: 64px; --chip-owner-w: 76px; --chip-more-w: 40px; --chip-gap: 6px;">${chips}</ul></div>` : `<p class="dept-empty">${t('empty')}</p>`}
      <div class="dept-tasks scroll" role="region" aria-label="${t(dept)}"><ul class="tasks">${tasks.map(taskCard).join('')}</ul></div>
    </section>`;
  }

  function board(narrow) {

    if (!narrow) return `<div class="depts">${DEPTS.map((d) => deptColumn(oid, d)).join('')}</div>`;

        <span class="dept-tab-counts"><span class="num">${t('nTasks', { n: tasksOf(oid, d).length })}</span>${late ? `<span class="dept-tab-late num">${t('late', { n: late })}</span>` : ''}</span></button>`;
    }).join('');
    return `<div class="dept-tabs" role="tablist" aria-label="${t('tabDepartments')}">${tabs}</div>
      <div class="depts dept-tab-panel" role="tabpanel">${deptColumn(oid, S.deptTab)}</div>`;
  }

  function moneyCard() {

    const net = 96240 - 41600 - rent;

      <div class="money-row"><dt>${t('received')}</dt><dd class="is-good">+$96,240</dd></div>
      <div class="money-row"><dt>${t('salaries')}</dt><dd>−$41,600</dd></div>
      <div class="money-row"><dt>${t('rentN', { n: S.offices.length })}</dt><dd>${usd(-rent)}</dd></div>
      <div class="money-row money-net ${net >= 0 ? 'is-good' : 'is-bad'}"><dt>${t('net')}</dt><dd>${t('perMonth', { a: signed(net) })}</dd></div>
      <div class="money-row money-sub"><dt>${t('cash')}</dt><dd>${usd(S.cash)}</dd></div></dl></section>`;
