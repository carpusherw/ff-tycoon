  function logCard() {
    const lines = [
      ['good', lang ? '台北收到 Fizzlewump Sodas 的 Local Charge $340。' : 'Taipei billed local charges of $340 for Fizzlewump Sodas.'],
      ['bad', lang ? '洛杉磯 OP 錯過 Bumblesprockle Bikes 的結關，罰款 $600。' : 'Los Angeles Ops missed the cut-off for Bumblesprockle Bikes: $600 fee.'],
      ['good', lang ? 'Brinequoll Lines 交給你一票指定貨：上海 → 台北。' : 'Brinequoll Lines sent you a shipment to handle: Shanghai → Taipei.'],
      ['info', lang ? '你在胡志明市開了辦公室，房租 $1,400 / 月。' : 'You opened an office in Ho Chi Minh City. Rent $1,400 / mo.'],
      ['good', lang ? 'Wobbleflonk Furniture 付款 $1,612。' : 'Wobbleflonk Furniture paid $1,612.'],
    ];
    return `<section class="card side-card log"><h2>${t('log')}</h2><ol class="log-lines scroll" tabindex="0">${lines.map(([tone, m], i) => `<li class="log-line is-${tone}"><span class="log-day">${t('day', { d: S.day - (i > 2 ? 1 : 0) })}</span><span class="log-msg">${esc(m)}</span></li>`).join('')}</ol></section>`;
  }

  // ---------- Map ----------
  const MAPW = 1000;
  // Hit-circle radius in map units: the laptop map draws about 0.91 px per unit, the phone strip about 0.57.
  const HIT_R = (compact) => (compact ? 29 : 18);
  const proj = (lon, lat) => [((((lon + 25) % 360) + 360) % 360) / 360 * MAPW, ((90 - lat) / 180) * 500];
  function projectPath(points) {
    const pieces = [];
    let piece = [];
    for (const [lon, lat] of points) {
      const next = proj(lon, lat);
      const prev = piece[piece.length - 1];
      if (prev) {
        const dx = next[0] - prev[0];
        if (Math.abs(dx) > MAPW / 2) {
          const leaveX = dx > 0 ? 0 : MAPW;
          const enterX = MAPW - leaveX;
          const unwrapped = dx > 0 ? next[0] - MAPW : next[0] + MAPW;
          const k = (leaveX - prev[0]) / (unwrapped - prev[0]);
          const edgeY = prev[1] + (next[1] - prev[1]) * k;
          piece.push([leaveX, edgeY]);
          pieces.push(piece);
          piece = [[enterX, edgeY]];
        }
      }
      piece.push(next);
    }
    if (piece.length) pieces.push(piece);
    return pieces;
  }
  function pointAlong(lines, f) {
    const segs = [];
    let total = 0;
    for (const l of lines) for (let i = 1; i < l.length; i++) {
      const len = Math.hypot(l[i][0] - l[i - 1][0], l[i][1] - l[i - 1][1]);
      segs.push({ a: l[i - 1], b: l[i], len });
      total += len;
    }
    let left = f * total;
    let seg = segs[segs.length - 1];
    for (const s of segs) { if (left <= s.len) { seg = s; break; } left -= s.len; }
    const k = seg.len ? Math.min(1, left / seg.len) : 1;
    return { x: seg.a[0] + (seg.b[0] - seg.a[0]) * k, y: seg.a[1] + (seg.b[1] - seg.a[1]) * k, angle: Math.atan2(seg.b[1] - seg.a[1], seg.b[0] - seg.a[0]) * 180 / Math.PI };
  }
  const lineD = (pts) => pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join('');

  // Gulf of Thailand carved out, as Task 3 of the plan does to land.ts.
  const LAND = WORLD.LAND.map((poly) => {
    const i = poly.findIndex(([a, b]) => a === 105 && b === 9);
    if (i < 0 || !(poly[i + 1] && poly[i + 1][0] === 104 && poly[i + 1][1] === 2)) return poly;
    return [...poly.slice(0, i + 1), [103.5, 10.5], [102.5, 12], [101, 12.8], [100.3, 13.4], [99.3, 10.5], [100.3, 7.5], [102.3, 6], [103.4, 4.5], ...poly.slice(i + 1)];
  });
  const LAND_D = LAND.map((poly) => `${lineD(poly.map(([lo, la]) => proj(lo, la)))}Z`);

  const VOYAGES = [
    ['TPE>LAX', 'Fizzlewump Sodas', 0.1, 46], ['SHA>TPE', 'Brinequoll Lines', 0.5, 14], ['LAX>RTM', 'Twinklefrob Lighting', 0.3, 60],
    ['TPE>SIN', 'Wobbleflonk Furniture', 0.7, 26], ['HAM>TPE', 'Picklezorp Snacks', 0.2, 58], ['TPE>SYD', 'Plinkadoo Audio', 0.55, 34],
    ['DXB>TPE', 'Glimmerquonk Candles', 0.85, 40], ['PUS>LAX', 'Bumblesprockle Bikes', 0.4, 44], ['RTM>TPE', 'Quillibrant Stationery', 0.65, 56],
    ['SIN>LAX', 'Hatterquiff Hats', 0.05, 52],
  ].map(([key, who, phase, secs]) => {
    const [from, to] = key.split('>');
    return { key, who, phase, secs, from, to, path: projectPath(WORLD.routes[key]) };
  });

  // Text width: canvas measure with the real fonts once loaded.
  const measureCtx = document.createElement('canvas').getContext('2d');
  const textW = (s, size, family, weight) => {
    measureCtx.font = `${weight} ${size}px ${family}`;
    return measureCtx.measureText(s).width;
  };

  /** Greedy label placement: each pin's bubble and each plain port's name takes the first spot that collides with nothing placed so far. */
  function placeLabels(k, compact) {
    const boxes = [];
    const hit = (a) => boxes.some((b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y);
    const inMap = (a) => a.x >= 2 && a.x + a.w <= MAPW - 2 && a.y >= 32 && a.y + a.h <= 388;
    const pins = [];
    const pinned = new Set();
    for (const o of S.offices) { pins.push({ port: o.port, kind: 'office', office: o }); pinned.add(o.port); }
    for (const p of Object.keys(S.agents)) if (!pinned.has(p)) { pins.push({ port: p, kind: 'agent' }); pinned.add(p); }
    // Pin heads and port dots are obstacles first.
    for (const p of pins) { const [x, y] = proj(PORTS[p.port][0], PORTS[p.port][1]); boxes.push({ x: x - 9 * k, y: y - 28 * k, w: 18 * k, h: 28 * k }); }
    const plain = Object.keys(PORTS).filter((p) => !pinned.has(p));
    for (const p of plain) { const [x, y] = proj(PORTS[p][0], PORTS[p][1]); boxes.push({ x: x - 3 * k, y: y - 3 * k, w: 6 * k, h: 6 * k }); }
    // The "Ships at sea" tag and the legend float over the map's corners; on the phone strip the tag and the
    // swipe hint sit over the top band wherever the strip is scrolled.
    if (!compact) boxes.push({ x: 0, y: 30, w: 165, h: 36 }, { x: 560, y: 350, w: 440, h: 40 });
    else boxes.push({ x: 0, y: 30, w: MAPW, h: 56 }, { x: 0, y: 350, w: MAPW, h: 40 });
    const out = { pins: [], plain: [] };
    for (const p of pins) {
      const [x, y] = proj(PORTS[p.port][0], PORTS[p.port][1]);
      const cityS = city(p.port);
      const sub = compact ? null : p.kind === 'office' ? t('yourOffice') : S.agents[p.port];
      const cs = 10 * k, ss = 7.5 * k, pad = 6 * k;
      const w = Math.max(textW(cityS, cs, 'Fredoka, Nunito, sans-serif', 600), sub ? textW(sub, ss, 'Nunito, sans-serif', 700) : 0) + pad * 2;
      const h = (sub ? 22 : 14) * k;
      const gap = 11 * k;
      // Close spots first; then farther ones, which get a thin leader line back to the pin.
      const spots = [
        [x + gap, y - h / 2 - 12 * k], [x - gap - w, y - h / 2 - 12 * k], [x + gap, y - h - 18 * k], [x - gap - w, y - h - 18 * k],
        [x + gap, y - 4 * k], [x - gap - w, y - 4 * k], [x - w / 2, y - 30 * k - h], [x - w / 2, y + 4 * k],
        [x + gap, y - h - 34 * k], [x - gap - w, y - h - 34 * k], [x + gap, y + 10 * k], [x - gap - w, y + 10 * k],
      ];
      for (const far of [20, 40, 60, 80]) {
        for (const dy of [-12, -36, 12, -60, 36]) {
          spots.push([x + gap + far * k, y - h / 2 + dy * k], [x - gap - w - far * k, y - h / 2 + dy * k]);
        }
        spots.push([x - w / 2, y - 30 * k - h - far * k], [x - w / 2, y + 4 * k + far * k]);
      }
      let pick = null;
      for (const [bx, by] of spots) { const b = { x: bx, y: by, w, h }; if (inMap(b) && !hit(b)) { pick = b; break; } }
      let hidden = false;
      if (!pick) {
        if (compact) hidden = true;
        pick = { x: spots[0][0], y: spots[0][1], w, h };
      }
      if (!hidden) boxes.push(pick);
      out.pins.push({ ...p, x, y, cityS, sub, cs, ss, pad, box: pick, hidden });
    }
    for (const p of plain) {
      const [x, y] = proj(PORTS[p][0], PORTS[p][1]);
      const s = city(p);
      const fs = (compact ? 10 : 8) * k * (compact ? 1 / 1.8 * 1.4 : 1);
      const w = textW(s, fs, 'Fredoka, Nunito, sans-serif', 600) + 2;
      const h = fs * 1.1;
      const spots = [[x + 5 * k, y - h / 2], [x - 5 * k - w, y - h / 2], [x - w / 2, y - 5 * k - h], [x - w / 2, y + 5 * k], [x + 5 * k, y - h], [x - 5 * k - w, y]];
      let pick = null;
      for (const [bx, by] of spots) { const b = { x: bx, y: by, w, h }; if (inMap(b) && !hit(b)) { pick = b; break; } }
      if (pick) boxes.push(pick);
      out.plain.push({ port: p, x, y, s, fs, box: pick });
    }
    return out;
  }

  function mapCard(compact) {
    const k = compact ? 1.8 : 1;
    const L = placeLabels(k, compact);
    const viewedPort = officeOf(S.viewed).port;
    const pins = L.pins.map((p) => {
      const fill = p.kind === 'office' ? 'var(--office)' : 'var(--agent)';
      const viewed = p.kind === 'office' && p.port === viewedPort;
      const head = `<g transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) scale(${0.85 * k})">${viewed ? '<circle class="pin-ring" cx="0" cy="-18" r="15"></circle>' : ''}<path class="pin-shape" style="fill:${fill}" d="M0,0 C-5,-7 -10,-11 -10,-18 A10,10 0 1 1 10,-18 C10,-11 5,-7 0,0Z"></path>${p.kind === 'office' ? '<path class="pin-house" d="M-5,-16 L0,-22 L5,-16 L5,-12 L-5,-12Z"></path>' : '<path class="pin-flag" d="M-3,-11 L-3,-24 M-3,-24 L5,-21 L-3,-18"></path>'}</g>`;
      const b = p.box;
      // A label placed away from its pin gets a thin leader line to the nearest edge of its bubble.
      const hx = p.x, hy = p.y - 18 * k;
      const nx = Math.max(b.x, Math.min(hx, b.x + b.w)), ny = Math.max(b.y, Math.min(hy, b.y + b.h));
      const leader = !p.hidden && Math.hypot(nx - hx, ny - hy) > 24 * k ? `<path class="pin-leader" d="M${hx.toFixed(1)},${hy.toFixed(1)}L${nx.toFixed(1)},${ny.toFixed(1)}"></path>` : '';
      const bubble = p.hidden ? '' : `${leader}<rect class="pin-bubble" x="${b.x.toFixed(1)}" y="${b.y.toFixed(1)}" width="${b.w.toFixed(1)}" height="${b.h.toFixed(1)}" rx="${8 * k}"></rect>
        <text class="pin-city" x="${(b.x + p.pad).toFixed(1)}" y="${(b.y + (p.sub ? 10 : 10.3) * k).toFixed(1)}" style="font-size:${p.cs}px">${esc(p.cityS)}</text>
        ${p.sub ? `<text class="pin-sub" x="${(b.x + p.pad).toFixed(1)}" y="${(b.y + 18.5 * k).toFixed(1)}" style="font-size:${p.ss}px">${esc(p.sub)}</text>` : ''}`;
      const label = p.kind === 'office' ? t('viewOfficePin', { c: p.cityS }) : p.cityS + (p.sub ? ', ' + p.sub : '');
      const officeAttr = p.kind === 'office' ? ` data-office="${p.office.id}"` : '';
      return `<g class="pin${viewed ? ' is-viewed' : ''}" data-pin="${p.port}" data-kind="${p.kind}"${officeAttr} role="button" tabindex="0" aria-label="${esc(label)}">${head}${bubble}</g>`;
    }).join('');
    const plain = L.plain.map((p) => {
      const lab = p.box && !compact ? `<text class="port-label" x="${p.box.x.toFixed(1)}" y="${(p.box.y + p.fs * 0.85).toFixed(1)}" style="font-size:${p.fs}px;stroke-width:${2.4 * k}px">${esc(p.s)}</text>` : '';
      return `<g data-port="${p.port}" role="button" tabindex="0" aria-label="${esc(p.s + ', ' + t('popOpen'))}"><circle class="port" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${2.6 * k}"></circle>${lab}</g>`;
    }).join('');
    // Transparent hit circles keep every pin and port at least 32 px across, even on the phone strip. They sit
    // under all pins, so in a crowd a visible pin head always wins the tap.
    const hits = [
      ...L.pins.map((p) => `<circle class="pin-hit" data-hit="${p.port}" cx="${p.x.toFixed(1)}" cy="${(p.y - 14 * k).toFixed(1)}" r="${HIT_R(compact)}"></circle>`),
      ...L.plain.map((p) => `<circle class="pin-hit" data-hit="${p.port}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${HIT_R(compact)}"></circle>`),
    ].join('');
    const land = (cls) => LAND_D.map((d) => `<path class="${cls}" d="${d}"></path>`).join('');
    const mtn = WORLD.MOUNTAINS.map(([lo, la]) => { const [x, y] = proj(lo, la); return `<g><path class="mtn" d="M${x - 9},${y + 5}L${x},${y - 8}L${x + 9},${y + 5}Z"></path><path class="mtn-snow" d="M${x - 3.5},${y - 3}L${x},${y - 8}L${x + 3.5},${y - 3}L${x + 1},${y - 4}L${x - 1},${y - 2.5}Z"></path></g>`; }).join('');
    const trees = WORLD.TREES.map(([lo, la], i) => { const [x, y] = proj(lo, la); return `<g><rect class="tree-trunk" x="${x - 0.9}" y="${y}" width="1.8" height="4"></rect><circle class="${i % 2 ? 'tree-top' : 'tree-top-2'}" cx="${x}" cy="${y - 1}" r="3.6"></circle></g>`; }).join('');
    const clouds = WORLD.CLOUDS.map((c) => `<g class="${c.reverse ? 'cloud is-reverse' : 'cloud'}">${[[0, 0, 9], [10, -4, 11], [21, 0, 8], [10, 3, 9]].map(([dx, dy, r]) => `<circle cx="${c.x + dx}" cy="${c.y + dy}" r="${r}"></circle>`).join('')}</g>`).join('');
    const routes = VOYAGES.map((v) => `<g>${v.path.map((pc) => `<path class="route-halo" d="${lineD(pc)}"></path>`).join('')}${v.path.map((pc) => `<path class="route-dots" d="${lineD(pc)}"></path>`).join('')}</g>`).join('');
    const ships = VOYAGES.map((v) => `<g class="ship" data-ship="${v.key}"><title>${esc(v.who)} · ${city(v.from)} → ${city(v.to)}</title><g class="ship-turn"><g class="ship-bob"><path class="ship-wake" d="M-12,3 q2,-2 4,0 M-15,1 q2,-2 4,0"></path><rect class="ship-cargo-1" x="-5.5" y="-4.6" width="3.2" height="3.2" rx="0.6"></rect><rect class="ship-cargo-2" x="-2" y="-4.6" width="3.2" height="3.2" rx="0.6"></rect><rect class="ship-cabin" x="2" y="-6.5" width="4" height="5" rx="1"></rect><path class="ship-hull" d="M-8,-1.4 L9,-1.4 L6,3.6 L-6.5,3.6Z"></path></g></g></g>`).join('');
    const svg = `<svg class="world-map" viewBox="0 30 1000 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="World map"><defs><pattern id="waves-m2" width="34" height="22" patternUnits="userSpaceOnUse"><path class="map-wave" d="M3 7q3-3 6 0t6 0M20 18q3-3 6 0t6 0"></path></pattern></defs>
      <rect class="map-sea" x="0" y="0" width="1000" height="500"></rect><rect x="0" y="0" width="1000" height="500" fill="url(#waves-m2)"></rect>
      <g class="map-land">${land('land-shadow')}${land('land-sand')}${land('land-main')}${mtn}${trees}</g>
      <g class="map-routes">${routes}</g><g class="map-clouds">${clouds}</g>
      <g class="map-hits">${hits}</g><g class="map-ports">${plain}</g><g class="map-pins">${pins}</g><g class="map-ships" data-k="${k}">${ships}</g></svg>`;
    const body = compact ? `<div class="map-strip">${svg}</div><span class="swipe-hint">${t('swipe')}</span>` : svg;
    return `<section class="card map-card${compact ? ' is-compact' : ''}">${body}
      <div class="map-tag"><span class="map-tag-icon">${icon('tag')}</span>${t('shipsAtSea', { n: VOYAGES.length })}</div>
      <div class="map-legend"><span><i class="is-office"></i>${t('legOffices', { n: S.offices.length })}</span><span><i class="is-agent"></i>${t('legAgents', { n: Object.keys(S.agents).length })}</span><span class="legend-regions">${t('legRegions', { n: regionsCovered() })}</span></div>
      ${popover()}</section>`;
  }

  function popover() {
    if (!S.pop) return '';
    const port = S.pop.port;
    const agent = S.agents[port];
    const office = officeAt(port);
    const c = city(port);
    const rent = usd(rentOf(port));
    const ctry = COUNTRY[PORTS[port][3]][lang];
    const btn = (cls, data, label, tip, hint, cost) => {
      const short = S.cash < cost;
      return `<span class="tip tip-block"><button type="button" class="btn ${cls} pop-btn" ${data}${short ? ' disabled' : ''} data-tip="${esc(tip)}" data-hint="${esc(hint)}">${label}</button></span>`;
    };
    const rows = [];
    if (!agent && !office) rows.push(btn('btn-agent', `data-sign="${port}"`, t('signBtn'), t('signTip', { c }), t('signTipHint', { c }), 5000));
    if (!office) {
      rows.push(btn('', `data-open="${port}"`, t('openBtn'), t('openTip', { c }), t('openTipHint', { r: rent }), 50000));
      rows.push(`<p class="pop-rent">${t('rentLine', { r: rent })}</p>`);
    }
    const short = (!agent && !office && S.cash < 5000) || (!office && S.cash < 50000);
    const msg = S.pop.msg ? `<p class="pop-msg is-good" role="status">✓ ${esc(S.pop.msg)}</p>` : '';
    const cash = short ? `<p class="pop-msg is-bad" role="status">${t('cantAfford', { c: usd(S.cash) })}</p>` : '';
    const line = agent ? t('popAgent', { a: esc(agent) }) : t('popOpen');
    return `<div class="pin-pop" role="dialog" aria-label="${esc(c)}" data-pop="${port}">
      <button type="button" class="pop-close" data-act="closepop" aria-label="${t('close')}">✕</button>
      <h3>${c}<small> · ${esc(ctry)}</small></h3><p class="pop-sub">${line}</p>${msg}<div class="pop-actions">${rows.join('')}</div>${cash}</div>`;
  }

  function helpDialog() {
    if (!S.help) return '';
    const row = (keys, what, isNew) => `<div class="hotkey-row"><dt>${keys}</dt><dd>${what}${isNew ? `<span class="new-flag">${t('newFlag')}</span>` : ''}</dd></div>`;
    const combo = (k) => `<kbd class="kbd-combo"><kbd>⇧</kbd><kbd>${k}</kbd></kbd>`;
    return `<div class="dialog-backdrop" data-backdrop="help"><div class="card small-dialog" role="dialog" aria-modal="true" aria-labelledby="hk-title" tabindex="-1">
      <div class="ribbon"><div class="ribbon-text"><h2 id="hk-title">${t('hkTitle')}</h2></div><span class="tip"><button type="button" class="close" data-act="closehelp" aria-label="${t('close')}"><span aria-hidden="true">✕</span></button></span></div>
      <section class="hotkeys"><dl>
        ${row(kbd('Space'), t('hkPause'))}${row(kbd('1') + kbd('3') + kbd('5'), t('hkSpeed'))}
        ${row(kbd('S') + kbd('O') + kbd('A'), t('hkMove'))}${row(combo('S') + combo('O') + combo('A'), t('hkHireDept'))}${row(kbd('H'), t('hkHire'))}
        ${row(kbd('[') + kbd(']'), t('hkOffice'), true)}${row(kbd('?') + kbd('/'), t('hkHelp'))}
      </dl></section></div></div>`;
  }

  function reportDialog() {
    if (!S.report) return '';
    const r = (k, v, cls = '') => `<div class="money-row ${cls}"><dt>${t(k)}</dt><dd>${v}</dd></div>`;
    return `<div class="dialog-backdrop" data-backdrop="report"><div class="card small-dialog" role="dialog" aria-modal="true" aria-labelledby="rp-title" tabindex="-1">
      <div class="ribbon"><div class="ribbon-text"><h2 id="rp-title">${t('rpTitle')}</h2><p>${t('rpSub')}</p></div></div>
      <dl class="money-rows">
        ${r('rpRevenue', '+$812,400', 'is-income')}${r('rpSalaries', '−$402,300')}${r('rpRent', '−$61,200')}${r('rpFees', '−$9,450')}${r('rpHiring', '−$6,400')}
        ${r('rpExpansion', '−$65,000')}${r('rpProfit', '+$268,050', 'money-net is-good')}${r('rpCash', '$212,600 → $480,650', 'money-sub')}
      </dl><span class="tip tip-block"><button type="button" class="btn btn-wide" data-act="closereport">${t('rpContinue')}</button></span></div></div>`;
  }

  // ---------- Layout ----------
  const narrowNow = () => (view === 'phone' ? true : view === 'laptop' ? false : window.matchMedia('(max-width: 768px)').matches);

  function game() {
    const narrow = narrowNow();
    const modal = !!(S.help || S.report);
    let main;
    if (!narrow) {
      main = `<main class="game-main game-grid"><div class="game-left">${mapCard(false)}${officeSwitch()}${board(false)}</div>
        <aside class="side">${moneyCard()}${logCard()}</aside></main>`;
    } else {
      const tabs = [['departments', 'tabDepartments'], ['money', 'tabMoney'], ['log', 'tabLog']];
      const tabBar = `<div class="tabs" role="tablist">${tabs.map(([id, k]) => `<button type="button" role="tab" class="tab" data-tab="${id}" aria-selected="${S.phoneTab === id}">${t(k)}</button>`).join('')}</div>`;
      const panels = {
        departments: `<div class="tab-panel is-board" role="tabpanel">${officeSwitch()}${board(true)}</div>`,
        money: `<div class="tab-panel scroll" role="tabpanel">${moneyCard()}</div>`,
        log: `<div class="tab-panel scroll" role="tabpanel">${logCard()}</div>`,
      };
      main = `<main class="game-main">${mapCard(true)}${tabBar}${panels[S.phoneTab]}</main>`;
    }
    return `<div class="game is-fixed-height${narrow ? ' is-narrow' : ''}" tabindex="-1"><div class="game-body"${modal ? ' inert' : ''}>${topbar()}${main}</div>${helpDialog()}${reportDialog()}<div class="tooltip" role="tooltip" hidden></div></div>`;
  }

  function mockPanel() {
    const seg = (name, cur, opts) => `<div class="mock-seg" role="group">${opts.map(([v, l]) => `<button type="button" data-mock="${name}" data-val="${v}" aria-pressed="${cur === v}">${l}</button>`).join('')}</div>`;
    const states = [
      ['pop-TYO', 'Pin popup: port not in your network (Tokyo)'], ['pop-SHA', 'Pin popup: agent (Shanghai)'],
      ['signed', 'Pin popup: just signed an agent (Tokyo)'], ['afford', 'Pin popup: not enough cash (Felixstowe)'],
      ['opened', 'After opening an office: board switches to Felixstowe'],
      ['view-o2', 'Office with late tasks (Los Angeles)'], ['view-o3', 'New office, no staff (Ho Chi Minh City)'], ['view-o1', 'Home office (Taipei): agent job + local charges'],
      ['hiretip', 'Hire button tooltip (Operations)'],
      ['report', 'Year report with the Expansion row'], ['help', 'Shortcut list with [ and ]'],
      ['phone-board', 'Phone: department tabs + office switcher'], ['phone-pop', 'Phone: pin popup on the map strip'], ['phone-money', 'Phone: Money tab'],
      ['reset', 'Reset the mockup'],
    ];
    return `<div class="mock-fab">${panelOpen ? `<div class="mock-panel" role="dialog" aria-label="Mockup controls">
        <h2>${t('mockTitle')}</h2><p>${t('mockNote')}</p>
        <h3>View</h3>${seg('view', view, [['auto', 'Auto'], ['laptop', 'Laptop'], ['phone', 'Phone frame']])}
        <h3>Theme</h3>${seg('theme', theme, [['system', 'System'], ['light', 'Light'], ['dark', 'Dark']])}
        <h3>Language</h3>${seg('lang', lang ? 'zh' : 'en', [['en', 'English'], ['zh', '繁體中文']])}
        <h3>Jump to a state</h3><ul class="mock-states">${states.map(([id, l]) => `<li><button type="button" data-state="${id}">${l}</button></li>`).join('')}</ul>
      </div>` : ''}<button type="button" class="mock-toggle" data-mock="panel" aria-expanded="${panelOpen}">${panelOpen ? 'Hide mockup controls' : 'Mockup controls ▸'}</button></div>`;
  }

  const root = document.getElementById('app');
  function render() {
    document.documentElement.lang = lang ? 'zh-Hant' : 'en';
    if (theme === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    const strip = root.querySelector('.map-strip');
    const scrollLeft = strip ? strip.scrollLeft : null;
    const g = game();
    root.innerHTML = view === 'phone' && !window.matchMedia('(max-width: 768px)').matches
      ? `<div class="phone-stage"><div class="phone-frame">${g}</div></div>${mockPanel()}`
      : `${g}${mockPanel()}`;
    const s2 = root.querySelector('.map-strip');
    if (s2) {
      if (scrollLeft !== null && !centerNext) s2.scrollLeft = scrollLeft;
      else centerOnViewed(s2);
      centerNext = false;
    }
    placePopover();
    focusPending();
  }
  let centerNext = true;
  function centerOnViewed(strip) {
    const svg = strip.querySelector('svg');
    const port = officeOf(S.viewed).port;
    const [x] = proj(PORTS[port][0], PORTS[port][1]);
    const w = svg.getBoundingClientRect().width;
    const target = (x / MAPW) * w - strip.clientWidth / 2;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    strip.scrollTo({ left: Math.max(0, target), behavior: reduce ? 'auto' : 'auto' });
  }
  function placePopover() {
    const pop = root.querySelector('.pin-pop');
    if (!pop) return;
    const card = pop.closest('.map-card');
    const pin = root.querySelector(`[data-pin="${pop.dataset.pop}"] path, [data-port="${pop.dataset.pop}"] circle`);
    if (!pin) return;
    const c = card.getBoundingClientRect();
    const r = pin.getBoundingClientRect();
    let left = r.left - c.left + r.width / 2 + 14;
    if (left + pop.offsetWidth > c.width - 8) left = r.left - c.left - pop.offsetWidth - 14;
    left = Math.max(8, Math.min(left, c.width - pop.offsetWidth - 8));
    let top = r.top - c.top - 20;
    top = Math.max(8, top);
    pop.style.left = `${left}px`;
    pop.style.top = `${top}px`;
  }
  let pendingFocus = null;
  function focusPending() {
    if (!pendingFocus) return;
    const el = root.querySelector(pendingFocus);
    pendingFocus = null;
    if (el) {
      el.focus({ preventScroll: true });
      el.scrollIntoView?.({ block: 'nearest' });
    }
  }

  // ---------- Actions ----------
  function sign(port) {
    if (S.cash < 5000 || S.agents[port] || officeAt(port)) return render();
    const name = NEW_AGENT_NAMES[S.nextName++ % NEW_AGENT_NAMES.length];
    S.cash -= 5000;
    S.agents[port] = name;
    // The popup stays on the port, now showing its new agent, so an office can follow.
    S.pop = { port, msg: t('signed', { a: name }) };
    pendingFocus = `.pin-pop [data-open="${port}"]`;
    render();
  }
  function open(port) {
    if (S.cash < 50000 || officeAt(port)) return render();
    S.cash -= 50000;
    const id = `o${S.offices.length + 1}`;
    S.offices.push({ id, port });
    BOARD[id] = { sales: { staff: [], tasks: [] }, ops: { staff: [], tasks: [] }, accounting: { staff: [], tasks: [] } };
    // Opening an office switches the board to it.
    S.pop = null;
    S.viewed = id;
    centerNext = true;
    pendingFocus = `.office-tab[data-office="${id}"]`;
    render();
  }
  function closePop() {
    const port = S.pop?.port;
    S.pop = null;
    if (port) pendingFocus = `[data-pin="${port}"], [data-port="${port}"]`;
    render();
  }
  function viewOffice(id) {
    S.viewed = id;
    S.pop = null;
    centerNext = true;
    render();
  }
  function stepOffice(d) {
    const i = S.offices.findIndex((o) => o.id === S.viewed);
    viewOffice(S.offices[(i + d + S.offices.length) % S.offices.length].id);
  }
  function workHere(dept) {
    S.owner = { office: S.viewed, dept };
    render();
  }

  function jump(id) {
    S = fresh();
    centerNext = true;
    if (id === 'reset') view = saved('m2mock.view', 'auto');
    if (id === 'phone-board' || id === 'phone-pop' || id === 'phone-money') view = 'phone';
    if (id.startsWith('pop-')) { S.pop = { port: id.slice(4) }; render(); }
    else if (id === 'signed') { S.pop = { port: 'TYO' }; sign('TYO'); }
    else if (id === 'afford') { S.cash = 31400; S.pop = { port: 'FXT' }; render(); }
    else if (id === 'opened') { open('FXT'); }
    else if (id.startsWith('view-')) viewOffice(id.slice(5));
    else if (id === 'hiretip') { render(); const b = root.querySelector('[data-hire="ops"]'); if (b) showTip(b); }
    else if (id === 'report') { S.report = true; render(); }
    else if (id === 'help') { S.help = true; render(); }
    else if (id === 'phone-board') { S.viewed = 'o2'; S.deptTab = 'ops'; render(); }
    else if (id === 'phone-pop') { S.pop = { port: 'JKT' }; render(); }
    else if (id === 'phone-money') { S.phoneTab = 'money'; render(); }
    else render();
  }

  root.addEventListener('click', (ev) => {
    const el = ev.target.closest('button, [data-pin], [data-port], [data-hit], [data-backdrop]');
    if (!el) {
      if (S.pop && !ev.target.closest('.pin-pop')) closePop();
      return;
    }
    const d = el.dataset;
    if (d.backdrop && ev.target === el) {
      // Tapping the backdrop closes the dialog and resumes, as shipped in #17.
      if (d.backdrop === 'help') S.help = false;
      if (d.backdrop === 'report') S.report = false;
      render();
      return;
    }
    if (d.mock === 'panel') { panelOpen = !panelOpen; render(); return; }
    if (d.mock === 'view') { view = d.val; keep('m2mock.view', view); centerNext = true; render(); return; }
    if (d.mock === 'theme') { theme = d.val; keep('m2mock.theme', theme); render(); return; }
    if (d.mock === 'lang') { lang = d.val === 'zh' ? 1 : 0; keep('m2mock.lang', d.val); render(); return; }
    if (d.state) { jump(d.state); return; }
    if (d.pin || d.port || d.hit) {
      const port = d.pin || d.port || d.hit;
      // An own-office pin switches straight to that office; other pins and ports open the popup.
      const office = officeAt(port);
      if (office) { viewOffice(office.id); pendingFocus = `[data-pin="${port}"]`; render(); return; }
      S.pop = S.pop && S.pop.port === port ? null : { port };
      if (S.pop) pendingFocus = `.pin-pop .pop-btn:not([disabled]), .pin-pop .pop-close`;
      render();
      return;
    }
    if (d.sign) return sign(d.sign);
    if (d.open) return open(d.open);
    if (d.office) return viewOffice(d.office);
    if (d.work) return workHere(d.work);
    if (d.hire) return;
    if (d.tab) { S.phoneTab = d.tab; render(); return; }
    if (d.depttab) { S.deptTab = d.depttab; render(); return; }
    if (d.speed !== undefined) { S.speed = Number(d.speed); render(); return; }
    switch (d.act) {
      case 'closepop': return closePop();
      case 'prev': return stepOffice(-1);
      case 'next': return stepOffice(1);
      case 'help': S.help = true; return render();
      case 'closehelp': S.help = false; return render();
      case 'closereport': S.report = false; return render();
      default:
    }
  });
  // Double-click a department to move the owner there (shipped in #17), now in the office on screen.
  root.addEventListener('dblclick', (ev) => {
    const col = ev.target.closest('.dept[data-dept]');
    if (col && !ev.target.closest('button')) workHere(col.dataset.dept);
  });
  root.addEventListener('keydown', (ev) => {
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches?.('[data-pin], [data-port]')) {
      ev.preventDefault();
      // SVG elements have no click(), so send the event the mouse would.
      ev.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.key === 'Escape') {
      if (S.pop) return closePop();
      if (S.help) { S.help = false; return render(); }
      if (S.report) { S.report = false; return render(); }
      if (panelOpen) { panelOpen = false; return render(); }
      return;
    }
    if (S.help || S.report) return;
    if (ev.key === '[') stepOffice(-1);
    else if (ev.key === ']') stepOffice(1);
    else if (ev.key === '?' || ev.key === '/') { S.help = true; render(); }
    else if (!ev.shiftKey && 'soa'.includes(ev.key.toLowerCase()) && ev.key.length === 1) workHere({ s: 'sales', o: 'ops', a: 'accounting' }[ev.key.toLowerCase()]);
  });

  // Tooltips: "action (key)" with the key as a keycap, as shipped.
  let tipTimer = null;
  const showTip = (el) => {
    const tip = root.querySelector('.tooltip');
    if (!tip) return;
    const keys = el.dataset.keys;
    const [l, r] = lang ? ['（', '）'] : [' (', ')'];
    const keyHtml = el.dataset.keyshtml || (keys ? keys.split(' ').map((k) => kbd(k)).join(' ') : '');
    tip.innerHTML = esc(el.dataset.tip) + (keyHtml ? `${l}${keyHtml}${r}` : '') + (el.dataset.hint ? `<span class="tooltip-hint">${esc(el.dataset.hint)}</span>` : '');
    tip.hidden = false;
    const a = el.getBoundingClientRect();
    const frame = el.closest('.phone-frame');
    const off = frame ? frame.getBoundingClientRect() : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
    const tw = tip.offsetWidth;
    const th = tip.offsetHeight;
    const left = Math.min(off.width - tw - 8, Math.max(8, a.left - off.left + a.width / 2 - tw / 2));
    const below = a.bottom - off.top + 8;
    const top = below + th + 8 <= off.height ? below : Math.max(8, a.top - off.top - 8 - th);
    tip.style.left = `${left}px`;
    tip.style.top = `${top}px`;
  };
  const hideTip = () => {
    clearTimeout(tipTimer);
    const tip = root.querySelector('.tooltip');
    if (tip) tip.hidden = true;
  };
  root.addEventListener('pointerover', (ev) => {
    const el = ev.target.closest('[data-tip]') || ev.target.closest('.tip')?.querySelector('[data-tip]');
    if (!el || ev.pointerType === 'touch') return;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => showTip(el), 350);
  });
  root.addEventListener('pointerout', (ev) => { if (ev.target.closest('[data-tip], .tip')) hideTip(); });
  root.addEventListener('focusin', (ev) => { const el = ev.target.closest('[data-tip]'); if (el && el.matches(':focus-visible')) showTip(el); });
  root.addEventListener('focusout', hideTip);

  // Ships glide along their real routes.
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  const start = performance.now();
  function frame(now) {
    const secs = reduced.matches ? 0 : (now - start) / 1000;
    for (const g of root.querySelectorAll('.map-ships')) {
      const k = Number(g.dataset.k) || 1;
      for (const el of g.querySelectorAll('[data-ship]')) {
        const v = VOYAGES.find((x) => x.key === el.dataset.ship);
        const f = (v.phase + secs / v.secs) % 1;
        const pose = pointAlong(v.path, f);
        const left = Math.abs(pose.angle) > 90;
        const norm = (deg) => ((((deg + 540) % 360) + 360) % 360) - 180;
        const tilt = Math.max(-20, Math.min(20, norm(left ? 180 - pose.angle : pose.angle)));
        el.setAttribute('transform', `translate(${pose.x.toFixed(2)},${pose.y.toFixed(2)})`);
        el.firstElementChild.nextElementSibling.setAttribute('transform', `scale(${left ? -k : k},${k}) rotate(${tilt.toFixed(1)})`);
      }
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', () => render());
  window.__mock = { jump, state: () => S, render };
  render();
  document.fonts?.ready.then(() => render());
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
